L('plane-triangles','Triângulos, congruência e desigualdade','35–57','Um triângulo tem três lados e três ângulos internos. Congruência significa que suas medidas correspondentes são iguais. Os critérios LLL, LAL e ALA permitem concluir congruência a partir de dados suficientes.¶A desigualdade triangular exige que cada lado seja menor que a soma dos outros dois. Além disso, a soma dos ângulos internos é 180°. Esses fatos limitam quais medidas podem formar um triângulo.','|b−c| < a < b+c\nA+B+C = 180°','Três segmentos cuja maior medida é igual à soma das outras não formam um triângulo.',(r,k)=>{const a=r(30,70),b=r(30,70);return qNum(`Dois ângulos internos de um triângulo medem ${a}° e ${b}°. Quanto mede o terceiro?`,180-a-b,[`A soma dos três ângulos internos é 180°.`,`O terceiro mede 180° − ${a}° − ${b}° = ${180-a-b}°.`], {kind:'diagram',shape:'triangle-angles',a,b})});
L('parallel-perpendicular','Paralelismo e perpendicularidade','60–95','No plano, retas paralelas distintas não se encontram. Quando uma transversal corta duas paralelas, ângulos correspondentes e alternos internos são congruentes; colaterais internos são suplementares.¶Retas perpendiculares formam ângulos retos. A distância de um ponto a uma reta é medida sobre a perpendicular, e não sobre qualquer segmento oblíquo.','Paralelas + transversal: alternos internos iguais; colaterais internos somam 180°','As relações angulares usadas dependem da posição dos ângulos.',(r,k)=>{const a=r(20,150),same=k%2;return qNum(`Duas retas paralelas são cortadas por uma transversal. Um ângulo mede ${a}°. Quanto mede seu ${same?'alterno interno':'colateral interno'}?`,same?a:180-a,[same?'Ângulos alternos internos entre paralelas são congruentes.':'Ângulos colaterais internos entre paralelas são suplementares.',same?`A medida é ${a}°.`:`180° − ${a}° = ${180-a}°.`], {kind:'diagram',shape:'parallel',a,same})});
L('quadrilaterals','Quadriláteros notáveis','96–118','Num paralelogramo, os lados opostos são paralelos, os ângulos opostos são iguais e as diagonais se cortam ao meio. Retângulo é o paralelogramo com quatro ângulos retos; losango tem quatro lados iguais; quadrado reúne as duas propriedades.¶No trapézio, a base média liga os pontos médios dos lados não paralelos. Ela é paralela às bases e mede a média aritmética de seus comprimentos.','Base média do trapézio: m = (B+b)/2','As diagonais de um paralelogramo se bissetam, mas não são necessariamente iguais.',(r,k)=>{const a=r(3,14),b=a+r(2,14);return qNum(`As bases de um trapézio medem ${a} e ${b}. Determine sua base média.`,fracText(a+b,2),[`A base média é a média das bases.`,`m = (${a}+${b})/2 = ${fracText(a+b,2)}.`], {kind:'diagram',shape:'trapezoid-mid',a,b})});
L('triangle-centers','Pontos notáveis do triângulo','119–126','As três medianas de um triângulo encontram-se no baricentro. Ele divide cada mediana na razão 2:1, contando a partir do vértice.¶As bissetrizes internas encontram-se no incentro; as mediatrizes, no circuncentro; as alturas, no ortocentro. O incentro é o centro da circunferência inscrita, e o circuncentro é o da circunscrita.','Na mediana AM, com baricentro G: AG = 2AM/3; GM = AM/3','Mediana liga vértice a ponto médio; altura é perpendicular à reta do lado oposto.',(r,k)=>{const m=3*r(2,10);return qNum(`Uma mediana mede ${m}. Quanto mede o trecho entre o vértice e o baricentro?`,2*m/3,[`O trecho junto ao vértice corresponde a 2/3 da mediana.`,`(2/3) · ${m} = ${2*m/3}.`], {kind:'diagram',shape:'median',m})});
L('plane-polygons','Polígonos: diagonais e ângulos','129–142','Um polígono convexo de n lados pode ser dividido, por diagonais traçadas a partir de um vértice, em n−2 triângulos. Daí vem a soma (n−2)·180° dos ângulos internos.¶De cada vértice partem n−3 diagonais. Como cada diagonal é contada pelas duas extremidades, o total é n(n−3)/2. A soma dos ângulos externos, tomados no mesmo sentido, é 360°.','Sᵢ = (n−2)180°\nD = n(n−3)/2','Ao contar diagonais, divida por 2 para evitar a dupla contagem.',(r,k)=>{const n=r(5,14),diag=k%2;return qNum(`Um polígono convexo tem ${n} lados. Determine ${diag?'o número de diagonais':'a soma dos ângulos internos em graus'}.`,diag?n*(n-3)/2:(n-2)*180,[diag?`D = n(n−3)/2 = ${n} · ${n-3}/2.`:`S = (n−2) · 180° = ${n-2} · 180°.`,`Resultado: ${diag?n*(n-3)/2:(n-2)*180}.`],{kind:'polygon',n})});
L('plane-circle','Circunferência, círculo e tangentes','143–160','Circunferência é o conjunto dos pontos do plano a uma distância fixa do centro; o círculo inclui também os pontos interiores. Uma corda liga dois pontos da circunferência; o diâmetro é uma corda que passa pelo centro.¶A reta tangente é perpendicular ao raio no ponto de contato. Dois segmentos tangentes traçados de um mesmo ponto exterior têm medidas iguais.','Diâmetro d = 2r\nTangentes de um mesmo ponto exterior: PA = PB','Raio, diâmetro e corda são segmentos diferentes.',(r,k)=>{const a=r(2,12),b=r(2,12),x=a+b;return qNum(`De P partem tangentes PA e PB a uma circunferência. PA = x − ${a} e PB = ${b}. Determine x.`,x,[`Os segmentos tangentes do mesmo ponto exterior são iguais.`,`x − ${a} = ${b}, logo x = ${x}.`], {kind:'diagram',shape:'tangents',a,b})});
L('inscribed-angle','Ângulos na circunferência','161–176','Um ângulo central tem vértice no centro e sua medida corresponde à medida do arco interceptado. Um ângulo inscrito tem vértice na circunferência e mede metade do arco que intercepta.¶Ângulos inscritos que interceptam o mesmo arco são congruentes. Um ângulo inscrito que intercepta uma semicircunferência mede 90°.','Ângulo inscrito = metade do arco interceptado','Use o arco que não contém o vértice do ângulo inscrito.',(r,k)=>{const arc=2*r(20,150);return qNum(`Um ângulo inscrito intercepta um arco de ${arc}°. Quanto mede esse ângulo?`,arc/2,[`A medida de um ângulo inscrito é metade da medida do arco.`,`${arc}°/2 = ${arc/2}°.`], {kind:'diagram',shape:'inscribed',arc})});
L('thales','Teorema de Tales e bissetrizes','177–189','Um feixe de retas paralelas determina, em duas transversais, segmentos correspondentes proporcionais. Essa é a relação central do teorema de Tales.¶A bissetriz interna de um ângulo de um triângulo divide o lado oposto em segmentos proporcionais aos lados adjacentes. É indispensável identificar corretamente os segmentos correspondentes antes de montar a proporção.','AB/BC = A′B′/B′C′\nBissetriz em A: BD/DC = AB/AC','Uma proporção precisa manter a mesma ordem de correspondência.',(r,k)=>{const a=r(2,8),b=r(2,8),scale=r(2,5);return qNum(`Três paralelas cortam duas transversais. Na primeira, os segmentos consecutivos medem ${a} e ${b}; na segunda, os correspondentes medem ${a*scale} e x. Determine x.`,b*scale,[`Monte ${a}/${b} = ${a*scale}/x.`,`A escala entre as transversais é ${scale}.`,`x = ${b} · ${scale} = ${b*scale}.`], {kind:'diagram',shape:'thales',a,b,scale})});
L('similarity','Semelhança e potência de ponto','192–213','Triângulos semelhantes têm ângulos correspondentes congruentes e lados correspondentes proporcionais. Os critérios AA, LAL proporcional e LLL proporcional ajudam a reconhecê-los.¶A razão entre comprimentos é k, e a razão entre áreas é k². Na potência de ponto, produtos de segmentos de secantes ou cordas relacionados à mesma circunferência são iguais.','Comprimentos: k; áreas: k²\nCordas que se cruzam: PA·PB = PC·PD','Semelhança não exige que os triângulos tenham o mesmo tamanho.',(r,k)=>{const scale=r(2,5),area=r(3,20);return qNum(`Dois triângulos semelhantes têm razão entre lados correspondentes igual a ${scale}, do maior para o menor. Se a área do menor é ${area}, qual é a área do maior?`,area*scale*scale,[`A razão entre áreas é o quadrado da razão entre lados: ${scale}² = ${scale*scale}.`,`Área maior = ${area} · ${scale*scale} = ${area*scale*scale}.`], {kind:'diagram',shape:'similarity',scale,area})});
L('metric-right','Relações métricas no triângulo retângulo','214–238','A altura relativa à hipotenusa divide o triângulo retângulo em dois triângulos semelhantes ao original. Dessa semelhança surgem relações entre catetos, projeções e altura.¶Se a hipotenusa mede a e é dividida em projeções m e n, então h²=mn. Cada cateto ao quadrado é o produto da hipotenusa por sua projeção, e o produto dos catetos é ah.','a = m+n; h² = mn\nb² = am; c² = an; bc = ah','As projeções m e n são segmentos sobre a hipotenusa.',(r,k)=>{const a=r(2,8),b=r(2,8),m=a*a,n=b*b;return qNum(`A altura à hipotenusa divide-a em segmentos de medidas ${m} e ${n}. Quanto mede essa altura?`,a*b,[`h² = mn = ${m} · ${n} = ${m*n}.`,`h = √${m*n} = ${a*b}.`], {kind:'diagram',shape:'altitude',m,n})});
L('general-triangle','Relações métricas em triângulos quaisquer','239–257','Em triângulos quaisquer, a lei dos cossenos relaciona dois lados, o ângulo entre eles e o lado oposto. Outras relações permitem calcular medianas e bissetrizes.¶A mediana relativa ao lado a tem quadrado mₐ² = (2b²+2c²−a²)/4. No caso isósceles, a mediana traçada do vértice principal também é altura e divide a base ao meio.','mₐ² = (2b²+2c²−a²)/4','Uma mediana não é necessariamente altura; isso depende das propriedades do triângulo.',(r,k)=>{const scale=r(1,4),[h,half,side]=r.pick([[3,4,5],[5,12,13],[8,15,17]]).map(v=>v*scale);return qNum(`Um triângulo isósceles tem lados iguais a ${side} e base ${2*half}. Qual é a altura relativa à base?`,h,[`A altura divide a base em duas partes de medida ${half}.`,`Pelo teorema de Pitágoras, h² = ${side}² − ${half}² = ${h*h}.`,`h = ${h}.`], {kind:'diagram',shape:'isosceles',side,base:2*half})});
L('regular-perimeter','Polígonos regulares e circunferência','258–289','Um polígono regular tem lados e ângulos congruentes. Dividindo-o em triângulos com vértice no centro, cada ângulo central mede 360°/n. A apótema é a distância do centro a um lado.¶O comprimento de uma circunferência é 2πr. Um arco de ângulo central α graus ocupa α/360 da volta e tem comprimento (α/360)·2πr.','Ângulo central: 360°/n\nC = 2πr; arco = (α/360°)·2πr','Apótema e raio só coincidem em situações limites, não num polígono regular comum.',(r,k)=>{const rad=r(2,12),angle=r.pick([30,45,60,90,120,180]);return qNum(`Um arco de raio ${rad} tem ângulo central ${angle}°. Seu comprimento é cπ. Determine c.`,fracText(2*rad*angle,360),[`A fração da volta é ${angle}/360.`,`Comprimento = (${angle}/360) · 2π · ${rad}.`,`c = ${fracText(2*rad*angle,360)}.`],{kind:'angle',degrees:angle})});
L('plane-areas','Equivalência e áreas planas','290–350','Figuras equivalentes têm a mesma área, mesmo quando suas formas são diferentes. Decompor e recompor figuras permite deduzir fórmulas: um paralelogramo equivale a um retângulo de mesma base e altura, e um triângulo ocupa metade dessa área.¶O trapézio usa a média das bases vezes a altura; o círculo tem área πr². Áreas de setores seguem a fração do ângulo central. Na semelhança, áreas variam com o quadrado da razão linear.','Atriângulo = bh/2\nAtrapézio = (B+b)h/2\nAcírculo = πr²','A altura deve ser perpendicular à base escolhida.',(r,k)=>{const a=r(3,12),b=a+r(2,12),h=2*r(2,8);return qNum(`Um trapézio tem bases ${a} e ${b} e altura ${h}. Calcule sua área.`,(a+b)*h/2,[`Use A = (B+b)h/2.`,`A = (${a}+${b}) · ${h}/2 = ${(a+b)*h/2}.`],{kind:'trapezoid',a,b,h})});
courseStage('Geometria espacial','Retas e planos, poliedros, corpos redondos e volumes.');
L('space-foundations','Pontos, retas e planos no espaço','1–16','Ponto, reta e plano são conceitos primitivos. O espaço é o conjunto de todos os pontos. Três pontos não colineares determinam um plano; uma reta e um ponto fora dela também o determinam.¶Duas retas podem ser concorrentes, paralelas ou reversas. Retas reversas não pertencem a um mesmo plano, portanto não se intersectam e não são paralelas.','Três pontos não colineares determinam um único plano.','Não se encontrar não basta para duas retas do espaço serem paralelas.',conceptBank([
 ['Quantos planos passam por três pontos não colineares?','Um',['Nenhum','Dois','Infinitos'],['Três pontos não colineares determinam um único plano.']],
 ['Duas retas que não estão num mesmo plano são chamadas de quê?','Reversas',['Paralelas','Concorrentes','Coincidentes'],['Retas reversas são não coplanares.']],
 ['Quantos planos passam por uma reta e um ponto fora dela?','Um',['Nenhum','Dois','Infinitos'],['A reta e o ponto exterior determinam um único plano.']],
 ['Quantos planos podem passar por uma mesma reta?','Infinitos',['Um','Dois','Nenhum'],['Uma reta pode funcionar como eixo de vários planos.']],
 ['Dois planos distintos que se intersectam têm em comum uma…','Reta',['Esfera','Região circular','Única semirreta'],['A interseção de dois planos distintos e secantes é uma reta.']],
 ['Três pontos colineares determinam um único plano?','Não; há infinitos planos que os contêm.',['Sim, sempre.','Não existe plano que os contenha.','Existem exatamente dois.'],['A condição de não colinearidade é necessária para a unicidade.']]
]));
L('space-parallel','Paralelismo entre retas e planos','17–34','Uma reta é paralela a um plano quando não possui ponto em comum com ele. Se uma reta fora de um plano é paralela a uma reta contida nesse plano, ela é paralela ao plano.¶Planos paralelos distintos não se intersectam. Uma reta perpendicular a um deles também é perpendicular ao outro. Em problemas espaciais, distinguir “contida no plano” de “paralela ao plano” evita conclusões incorretas.','Reta paralela a plano: nenhum ponto em comum.','Uma reta contida no plano tem infinitos pontos em comum com ele.',conceptBank([
 ['Uma reta não possui ponto em comum com um plano. Qual é sua posição?','Paralela ao plano',['Contida no plano','Secante ao plano','Perpendicular e contida'],['Por definição, reta e plano sem ponto comum são paralelos.']],
 ['Uma reta tem dois pontos distintos em um plano. O que se conclui?','A reta inteira está contida no plano.',['A reta é paralela ao plano.','A reta tem só dois pontos no plano.','A reta é reversa ao plano.'],['Se dois pontos de uma reta pertencem a um plano, a reta pertence ao plano.']],
 ['Dois planos distintos e paralelos têm quantos pontos em comum?','Nenhum',['Um','Dois','Infinitos'],['Planos paralelos distintos não se encontram.']],
 ['Uma reta tem exatamente um ponto em comum com um plano. Ela é…','Secante ao plano',['Contida no plano','Paralela ao plano','Coincidente com o plano'],['A interseção de uma reta secante com um plano é um ponto.']],
 ['Duas retas paralelas distintas são coplanares?','Sim',['Não','Apenas se forem horizontais'],['Duas retas paralelas distintas determinam um plano.']],
 ['Retas reversas podem pertencer a um mesmo plano?','Não',['Sim','Apenas quando têm comprimentos iguais'],['Serem não coplanares faz parte da definição de retas reversas.']]
]));
L('space-perpendicular','Perpendicularidade, projeções e distâncias','35–74','Uma reta é perpendicular a um plano quando é perpendicular às retas do plano que passam por seu ponto de interseção. Basta verificar a perpendicularidade a duas retas concorrentes desse plano.¶A projeção ortogonal de um ponto é o pé da perpendicular ao plano. Segmentos oblíquos, suas projeções e as distâncias ao plano frequentemente formam triângulos retângulos, permitindo usar Pitágoras.','Distância ao plano = comprimento do segmento perpendicular.','Uma reta perpendicular a apenas uma reta do plano não é necessariamente perpendicular ao plano.',(r,k)=>{const scale=r(1,4),[h,d,c]=r.pick([[3,4,5],[5,12,13],[8,15,17]]).map(v=>v*scale);return qNum(`P está a ${h} unidades de um plano. H é sua projeção e A está no plano com HA = ${d}. Determine PA.`,c,[`PH é perpendicular ao plano, portanto ao segmento HA.`,`No triângulo retângulo PHA: PA² = ${h}² + ${d}² = ${c*c}.`,`PA = ${c}.`],triangleSVG(d,h))});
L('dihedra','Diedros, triedros e seções','77–119','Um diedro é formado por dois semiplanos de mesma origem, chamada aresta. Sua medida é a medida de uma seção normal à aresta.¶Um triedro tem três faces e três arestas que partem do mesmo vértice. As medidas das faces obedecem a restrições: cada uma é menor que a soma das outras duas, e a soma das três é menor que 360° num triedro convexo.','Medida de um diedro = medida de uma seção normal.','Uma seção oblíqua não mede, em geral, o ângulo do diedro.',(r,k)=>{const a=r(20,150);return qNum(`A seção normal de um diedro mede ${a}°. Quanto mede o diedro suplementar a ele?`,180-a,[`Diedros suplementares somam 180°.`,`180° − ${a}° = ${180-a}°.`], {kind:'angle',degrees:a})});
L('polyhedra','Poliedros convexos e relação de Euler','120–133','Um poliedro convexo é limitado por faces poligonais planas. As faces se encontram em arestas, e as arestas se encontram em vértices.¶Para um poliedro convexo, V − A + F = 2. Essa relação liga as três contagens. Em um prisma de base com n lados, por exemplo, há 2n vértices, 3n arestas e n+2 faces.','V − A + F = 2','Use a relação de Euler nas condições indicadas, como poliedros convexos.',(r,k)=>{const n=r(3,10),v=2*n,f=n+2;return qNum(`Um poliedro convexo tem ${v} vértices e ${f} faces. Quantas arestas possui?`,v+f-2,[`Pela relação de Euler, A = V + F − 2.`,`A = ${v} + ${f} − 2 = ${v+f-2}.`], {kind:'flow',items:[`${v} vértices`,`${f} faces`,'Arestas = ?']})});
L('prisms','Prismas, áreas e volume','134–174','Um prisma tem duas bases congruentes situadas em planos paralelos. A altura é a distância entre os planos das bases. No prisma reto, as arestas laterais são perpendiculares às bases.¶O volume é a área da base multiplicada pela altura. Para um paralelepípedo retângulo, isso dá V=abc; sua diagonal satisfaz d²=a²+b²+c². No prisma reto, a área lateral é o perímetro da base vezes a altura.','Vprisma = Aᵦh\ndparalelepípedo = √(a²+b²+c²)','No prisma oblíquo, altura e aresta lateral são medidas diferentes.',(r,k)=>{const a=r(2,9),b=r(2,8),h=r(2,10);return qNum(`Um paralelepípedo retângulo tem arestas ${a}, ${b} e ${h}. Determine seu volume.`,a*b*h,[`A área da base é ${a} · ${b} = ${a*b}.`,`V = Aᵦh = ${a*b} · ${h} = ${a*b*h}.`],{kind:'box',a,b,h})});
L('pyramids','Pirâmides','177–206','Uma pirâmide tem uma base poligonal e faces laterais triangulares que se encontram no vértice. Sua altura é a distância do vértice ao plano da base.¶O volume de uma pirâmide é um terço do produto da área da base pela altura. Pirâmides com a mesma área da base e a mesma altura têm o mesmo volume, ainda que suas formas sejam diferentes.','Vpirâmide = Aᵦh/3','A altura usada no volume não é a altura inclinada de uma face lateral.',(r,k)=>{const a=r(2,9),h=3*r(2,8);return qNum(`Uma pirâmide tem base quadrada de lado ${a} e altura ${h}. Qual é seu volume?`,a*a*h/3,[`Aᵦ = ${a}² = ${a*a}.`,`V = ${a*a} · ${h}/3 = ${a*a*h/3}.`],{kind:'pyramid',a,h})});
L('cylinders','Cilindros','207–223','Um cilindro circular possui bases circulares congruentes em planos paralelos. Sua altura é a distância entre esses planos. No cilindro reto, a geratriz tem a mesma medida da altura.¶Ao abrir a superfície lateral de um cilindro reto, obtemos um retângulo de lados 2πr e h. Daí Aₗ=2πrh; o volume é πr²h. Para a área total, acrescentamos as duas bases.','Aₗ = 2πrh; Aₜ = 2πrh + 2πr²\nV = πr²h','Área tem unidade ao quadrado; volume, ao cubo.',(r,k)=>{const rad=r(2,8),h=r(3,12),area=k%2;return qNum(`Um cilindro reto tem raio ${rad} e altura ${h}. ${area?'Sua área lateral':'Seu volume'} é cπ. Determine c.`,area?2*rad*h:rad*rad*h,[area?'Aₗ = 2πrh.':'V = πr²h.',area?`c = 2 · ${rad} · ${h} = ${2*rad*h}.`:`c = ${rad}² · ${h} = ${rad*rad*h}.`],{kind:'cylinder',r:rad,h})});
L('cones','Cones','224–240','Um cone circular reúne os segmentos que ligam um vértice aos pontos de um círculo situado em outro plano. No cone reto, o vértice se projeta no centro da base.¶O raio r, a altura h e a geratriz g formam um triângulo retângulo: g²=r²+h². A área lateral é πrg, e o volume é um terço do volume do cilindro de mesma base e altura.','g² = r²+h²\nAₗ = πrg; V = πr²h/3','A geratriz entra na área lateral; a altura entra no volume.',(r,k)=>{const scale=r(1,4),[rad,h,g]=r.pick([[3,4,5],[5,12,13],[8,15,17]]).map(v=>v*scale);return qNum(`Um cone reto tem raio ${rad} e altura ${h}. Determine a geratriz.`,g,[`g² = r²+h² = ${rad}²+${h}² = ${g*g}.`,`g = ${g}.`],{kind:'cone',r:rad,h})});
L('spheres','Esfera: área e volume','241–255','A esfera de centro O e raio r é o conjunto dos pontos do espaço cuja distância a O é menor ou igual a r. A superfície esférica reúne apenas os pontos à distância exatamente r.¶A área da superfície é 4πr² e o volume da esfera é 4πr³/3. A distinção entre sólido e superfície evita confundir área com volume.','A = 4πr²\nV = 4πr³/3','Ao dobrar o raio, a área multiplica por 4 e o volume por 8.',(r,k)=>{const rad=3*r(1,5),area=k%2,ans=area?4*rad*rad:4*rad**3/3;return qNum(`Uma esfera tem raio ${rad}. ${area?'Sua área superficial':'Seu volume'} é cπ. Determine c.`,ans,[area?'A = 4πr².':'V = 4πr³/3.',area?`c = 4 · ${rad}² = ${ans}.`:`c = 4 · ${rad}³/3 = ${ans}.`],{kind:'sphere',r:rad})});
L('frusta','Sólidos semelhantes e troncos','258–289','Um plano paralelo à base de uma pirâmide separa uma pirâmide menor semelhante à original e um tronco. Na semelhança, comprimentos variam por k, áreas por k² e volumes por k³.¶Para um tronco de cone com altura h e raios R e r, o volume pode ser obtido como diferença de dois cones semelhantes. A fórmula resultante é πh(R²+Rr+r²)/3.','Vtronco de cone = πh(R²+Rr+r²)/3','A altura do tronco é a distância entre suas bases, não a altura do cone completo.',(r,k)=>{const small=r(1,5),big=small+r(1,5),h=3*r(1,6),ans=h*(big*big+big*small+small*small)/3;return qNum(`Um tronco de cone tem raios ${big} e ${small} e altura ${h}. Seu volume é cπ. Determine c.`,ans,[`Use c = h(R²+Rr+r²)/3.`,`c = ${h} · (${big*big}+${big*small}+${small*small})/3 = ${ans}.`],{kind:'flow',items:[`R = ${big}`,`r = ${small}`,`h = ${h}`]})});
L('inscribed-solids','Inscrição e circunscrição de sólidos','290–321','Um sólido inscrito toca a superfície do sólido que o contém nas condições indicadas pelo problema. As relações entre as medidas devem ser obtidas por uma seção ou por segmentos característicos.¶Numa esfera inscrita em um cubo, o diâmetro é a aresta do cubo. Numa esfera circunscrita ao cubo, o diâmetro é a diagonal espacial do cubo. Esses são problemas diferentes.','Esfera inscrita no cubo: r = a/2\nEsfera circunscrita: R = a√3/2','Inscrita e circunscrita invertem qual sólido contém o outro.',(r,k)=>{const a=r(3,20);return qNum(`Uma esfera está inscrita em um cubo de aresta ${a}. Qual é o raio da esfera?`,fracText(a,2),[`A esfera tangencia as faces opostas do cubo. Seu diâmetro é ${a}.`,`r = ${a}/2 = ${fracText(a,2)}.`], {kind:'diagram',shape:'insphere',a})});
L('revolution-caps','Revolução, calotas e zonas esféricas','322–358','Uma superfície de revolução é gerada pelo giro de uma linha em torno de um eixo coplanar; o giro de uma região pode gerar um sólido. Um retângulo que gira em torno de um de seus lados gera um cilindro.¶Na esfera, uma calota é a parte da superfície separada por um plano. Sua área depende do raio R da esfera e da altura h da calota: A=2πRh. A área de uma zona esférica segue a mesma expressão com a altura entre os planos.','Acalota = 2πRh','O raio R é o da esfera inteira, não o da circunferência de corte.',(r,k)=>{const R=r(3,12),h=r(1,2*R-1);return qNum(`Uma calota de altura ${h} pertence a uma esfera de raio ${R}. Sua área é cπ. Determine c.`,2*R*h,[`A = 2πRh.`,`c = 2 · ${R} · ${h} = ${2*R*h}.`], {kind:'diagram',shape:'cap',R,h})});
courseStage('Matemática financeira e estatística','Proporções, juros e interpretação de dados.');
L('ratios','Razões e proporções','1–6','Dados a e b, com b ≠ 0, chamamos de razão de a para b, nessa ordem, ao quociente a/b. Quando as duas medidas são da mesma grandeza, precisam estar na mesma unidade.¶Uma proporção é uma igualdade entre razões. Se a/b=c/d, com b e d não nulos, então ad=bc. Essa propriedade permite determinar um termo desconhecido.','a/b = c/d ⇔ ad = bc, com b,d ≠ 0','A ordem da razão importa: a/b não é, em geral, igual a b/a.',(r,k)=>{const a=r(2,9),b=r(2,9),scale=r(2,7);return qNum(`Determine x na proporção ${a}/${b} = x/${b*scale}.`,a*scale,[`Multiplique em cruz: ${b}x = ${a} · ${b*scale}.`,`x = ${a*scale}.`])});
L('proportional-quantities','Grandezas diretas e inversas','7–10','Duas grandezas são diretamente proporcionais quando a razão entre medidas correspondentes é constante: y=kx. São inversamente proporcionais quando o produto é constante: xy=k.¶Na proporcionalidade direta, dobrar uma medida dobra a outra. Na inversa, dobrar uma reduz a outra à metade, mantendo as condições do problema.','Direta: y/x = k\nInversa: xy = k','Nem toda relação entre duas grandezas é proporcional.',(r,k)=>{const workers=r(2,8),days=2*r(3,10);return qNum(`${workers} trabalhadores iguais concluem uma tarefa em ${days} dias. Mantida a produtividade, em quantos dias ${2*workers} trabalhadores concluirão a mesma tarefa?`,days/2,[`Trabalhadores e tempo são inversamente proporcionais para a mesma tarefa.`,`${workers} · ${days} = ${2*workers} · t.`,`t = ${days/2} dias.`])});
L('percentages','Porcentagens','11–24','Uma porcentagem representa uma razão de denominador 100. Calcular p% de uma quantidade Q significa multiplicar Q por p/100.¶Para descobrir que porcentagem uma parte representa do total, dividimos parte por total e multiplicamos por 100. O total usado como referência precisa estar claro.','p% de Q = (p/100)Q','A base percentual é o total de referência, não necessariamente a quantidade maior.',(r,k)=>{const q=20*r(5,30),p=r.pick([5,10,15,20,25,30,40]);return qNum(`Calcule ${p}% de ${q}.`,p*q/100,[`Converta ${p}% em ${p}/100.`,`${q} · ${p}/100 = ${p*q/100}.`])});
L('percentage-change','Variações percentuais sucessivas','25–31','A variação percentual compara a diferença entre valores com o valor inicial. Um aumento de i corresponde ao fator 1+i; um desconto, ao fator 1−i, com i na forma decimal.¶Em alterações sucessivas, os fatores se multiplicam. Um aumento de 20% seguido de redução de 20% não retorna ao valor original, pois a segunda taxa incide sobre uma base diferente.','Fator acumulado = (1+i₁)(1+i₂)…\nVariação = (valor final/valor inicial − 1)·100%','Taxas sucessivas não devem ser simplesmente somadas.',(r,k)=>{const p=r.pick([10,20,25,30]),value=100*r(5,30),final=value*(1+p/100)*(1-p/100);return qNum(`Um produto de R$ ${value} sofre aumento de ${p}% e depois desconto de ${p}%. Qual é o preço final, em reais?`,money(final),[`Após o aumento: ${value} · ${1+p/100} = ${money(value*(1+p/100))}.`,`Depois do desconto, multiplique por ${1-p/100}.`,`Preço final: R$ ${money(final)}.`])});
L('inflation','Taxas acumuladas e poder de compra','32–36','Uma taxa acumulada resulta da multiplicação dos fatores de variação dos períodos. Se os preços crescem por um fator F, o poder de compra de uma quantia fixa é dividido por F.¶Para comparar um rendimento com a inflação, dividimos o fator de rendimento pelo fator de preços e subtraímos 1. A diferença simples entre as taxas é apenas uma aproximação em certas situações.','Taxa acumulada = [(1+i₁)(1+i₂) − 1]·100%','Percentuais relativos e pontos percentuais são conceitos distintos.',(r,k)=>{const a=r.pick([5,10,20]),b=r.pick([5,10,20]),p=((100+a)*(100+b)-10000)/100;return qNum(`Os preços sobem ${a}% e depois ${b}%. Qual é a alta acumulada, em porcentagem? Digite apenas o número.`,String(p),[`Fator total = (1 + ${a}/100)(1 + ${b}/100).`,`Subtraia 1 e multiplique por 100: ${p}%.`])});
L('simple-interest','Capital, juros simples e montante','37–47','Capital é a quantia inicialmente aplicada ou emprestada. Juros remuneram o uso desse capital, e montante é a soma do capital com os juros.¶No regime simples, os juros de cada período são calculados sobre o mesmo capital inicial. Assim, J=Cit e M=C(1+it). A taxa e o prazo precisam estar expressos na mesma unidade de tempo.','J = Cit; M = C+J = C(1+it)','Use i na forma decimal e compatível com a unidade de t.',(r,k)=>{const c=100*r(5,40),i=r(1,6),t=r(2,12),j=c*i*t/100;return qNum(`Um capital de R$ ${c} rende juros simples de ${i}% ao mês por ${t} meses. Qual é o juro, em reais?`,j,[`i = ${i}/100 e t = ${t} meses.`,`J = ${c} · ${i}/100 · ${t} = ${j}.`])});
L('simple-discount','Descontos simples','48–51','O desconto é a redução aplicada a um valor a pagar. No desconto comercial simples, calculamos D=Nit sobre o valor nominal N, com taxa i e prazo t compatíveis. O valor atual é A=N−D.¶No desconto racional simples, o valor atual é obtido por A=N/(1+it). A distinção importa porque as bases de cálculo são diferentes; o enunciado deve informar o regime.','Comercial: D=Nit; A=N(1−it)\nRacional: A=N/(1+it)','Não confunda desconto comercial com racional.',(r,k)=>{const n=100*r(10,50),i=r(1,4),t=r(2,6),d=n*i*t/100;return qNum(`Um título de R$ ${n} recebe desconto comercial simples de ${i}% ao mês por ${t} meses de antecipação. Qual é o valor atual, em reais?`,n-d,[`D = N i t = ${n} · ${i}/100 · ${t} = ${d}.`,`A = N − D = ${n} − ${d} = ${n-d}.`])});
L('compound-interest','Juros compostos','52–59','Nos juros compostos, a base de cálculo de cada período é o saldo acumulado no período anterior. Após um período, M₁=C(1+i); após dois, M₂=C(1+i)².¶Repetindo o raciocínio, M=C(1+i)ⁿ. Para taxas variáveis, multiplicamos os fatores de cada período. Se o problema pede valores monetários, faça o arredondamento final para centavos.','M = C(1+i)ⁿ','Não arredonde repetidamente durante os cálculos, salvo se o problema determinar isso.',(r,k)=>{const c=100*r(5,50),i=r.pick([2,5,10,15]),n=r(2,4),v=money(c*(1+i/100)**n);return qNum(`R$ ${c} são aplicados a juros compostos de ${i}% ao ano por ${n} anos. Qual é o montante? Arredonde para centavos e responda em reais.`,v,[`M = ${c} · (1 + ${i}/100)^${n}.`,`Calcule a potência antes de arredondar.`,`Montante final: R$ ${v}.`])});
L('cash-flows','Valor atual e pagamentos uniformes','60–70','Para comparar capitais de datas diferentes, transportamos todos para uma mesma data usando a taxa indicada. Um valor F devido após n períodos equivale hoje a F/(1+i)ⁿ.¶Uma sequência uniforme é um conjunto de pagamentos iguais, separados por intervalos iguais. O valor atual é a soma dos pagamentos descontados; o montante é a soma dos depósitos capitalizados até a data escolhida.','Valor atual: V = F/(1+i)ⁿ\nParcelas postecipadas: V = P[1−(1+i)⁻ⁿ]/i','Indique se os pagamentos ocorrem no início ou no fim de cada período.',(r,k)=>{const p=100*r(1,8),i=10,n=2,ans=p*(1.1)+p;return qNum(`São feitos dois depósitos de R$ ${p}, um ao fim do mês 1 e outro ao fim do mês 2, a 10% ao mês. Qual é o saldo imediatamente após o segundo depósito?`,money(ans),[`O primeiro depósito rende por um mês: ${p} · 1,10 = ${money(p*1.1)}.`,`O segundo acaba de entrar e ainda não rendeu.`,`Saldo = ${money(p*1.1)} + ${p} = R$ ${money(ans)}.`])});
L('statistical-data','Variáveis, frequências e gráficos','73–106','A estatística organiza e analisa dados. Variáveis qualitativas descrevem categorias; variáveis quantitativas descrevem medidas ou contagens. Uma amostra precisa representar adequadamente a população sobre a qual se quer concluir.¶Uma tabela de frequência registra quantas vezes ocorre cada valor ou categoria. A frequência relativa divide essa contagem pelo total; num gráfico de setores, o ângulo correspondente é essa proporção multiplicada por 360°.','Frequência relativa = frequência absoluta / total\nÂngulo do setor = frequência relativa · 360°','A soma das frequências relativas é 1, ou 100%.',(r,k)=>{const total=20*r(2,8),part=r(1,total-1);return qNum(`Numa pesquisa com ${total} pessoas, ${part} escolheram uma opção. Qual é a frequência relativa dessa opção? Responda como fração do total.`,fracText(part,total),[`A frequência absoluta é ${part} e o total é ${total}.`,`A frequência relativa é ${part}/${total} = ${fracText(part,total)}.`])});
L('central-tendency','Média, mediana e moda','107–125','A média aritmética é a soma dos valores dividida pelo número de observações. Numa média ponderada, cada valor é multiplicado por seu peso e dividimos a soma desses produtos pela soma dos pesos.¶A mediana é obtida depois de ordenar os dados: para quantidade ímpar, é o valor central; para quantidade par, é a média dos dois centrais. A moda é o valor de maior frequência e pode não ser única.','x̄ = Σxᵢ/n\nMédia ponderada = Σwᵢxᵢ/Σwᵢ','Ordene os dados antes de procurar a mediana.',(r,k)=>{const v=Array.from({length:5},()=>r(1,25)),sorted=[...v].sort((a,b)=>a-b),mean=k%2,ans=mean?fracText(v.reduce((a,b)=>a+b),5):sorted[2];return qNum(`Calcule a ${mean?'média aritmética':'mediana'} dos valores ${v.join(', ')}.`,ans,mean?[`Soma = ${v.reduce((a,b)=>a+b)}.`,`Dividindo por 5, a média é ${ans}.`]:[`Ordenando: ${sorted.join(', ')}.`,`Há cinco valores; o terceiro é ${sorted[2]}.`],{kind:'bars',values:v})});
L('dispersion','Variância e desvio padrão','126–159','Medidas de dispersão descrevem o quanto os valores se afastam do centro. Na variância populacional, calculamos a média dos quadrados dos desvios em relação à média.¶O desvio padrão é a raiz quadrada da variância e tem a mesma unidade dos dados. Nesta aula, dividimos pelo número n de observações; a fórmula amostral com n−1 pertence a outro contexto.','σ² = Σ(xᵢ−x̄)²/n\nσ = √σ²','A variância tem unidade ao quadrado; o desvio padrão tem a unidade original.',(r,k)=>{const a=r(8,20),d=r(1,7),v=[a-d,a-d,a+d,a+d],std=k%2;return qNum(`Considere a população de quatro valores ${v.join(', ')}. Calcule ${std?'o desvio padrão':'a variância'} populacional.`,std?d:d*d,[`A média é ${a}.`,`Os desvios são −${d}, −${d}, ${d}, ${d}.`,`A variância é (4 · ${d*d})/4 = ${d*d}.`,std?`O desvio padrão é √${d*d} = ${d}.`:`A resposta pedida é ${d*d}.`],{kind:'bars',values:v})});

function validSave(raw){
  const g=fresh();if(!raw||typeof raw!=='object'||Array.isArray(raw))return g;

  for(const k of ['xp','tot','ok','streak','best','f5','bf5','f8','bf8','br','cok','rounds'])g[k]=Math.floor(g[k]);
  g.ok=Math.min(g.ok,g.tot);g.streak=Math.min(g.streak,g.ok);g.br=Math.min(g.br,g.rounds);
  g.N=[5,10,20].includes(raw.N)?raw.N:10;

  if(raw.cats&&typeof raw.cats==='object')C.forEach((_,i)=>{const c=raw.cats[i];if(Array.isArray(c)&&c.length===2&&c.every(Number.isSafeInteger)&&c[0]>0&&c[1]>=0&&c[1]<=c[0])g.cats[i]=c});

  g.course=validateCourse(raw.course);g.visuals=raw.visuals!==false;

    const i=OLD_RK.reduce((k,r,j)=>g.xp>=r[1]?j:k,0),lo=OLD_RK[i][1],hi=OLD_RK[i+1]?.[1];

}

  return `<div class="pl rank"><div>${badge(i,116)}</div><div class="rk"><small class="gd">Patente atual</small><h2>${RK[i][0]}</h2><div class="bar"><i style="width:${pc}%"></i></div><div class="xpl"><small>${n?`Faltam ${n[1]-G.xp} XP para ${n[0]}`:'Patente máxima alcançada'}</small><b>${G.xp}${n?' / '+n[1]:''} XP</b></div><small>Nível ${lv()}</small></div>${n?`<div class="nx">${badge(i+1,46)}<span>Próxima patente<br><b>${n[0]}</b></span></div>`:''}<div class="kp"><div class="pl mini"><span class="em">🔥</span><div><small>Sequência atual</small><br><b>${G.streak}</b> <small>respostas seguidas</small></div></div><div class="pl mini"><span class="em">⚡</span><div><small>Velocidade média</small><br><b>${G.tot?(G.sum/G.tot).toFixed(1).replace('.',','):'—'}</b> <small>s por resposta</small></div></div></div></div>`}
function achCard(a,i,st){const p=Math.min(a[3],a[4](G)),u=G.ach[i];
  return `<div class="pl ac${st==2?' l':''}"><div class="hx"><span>${a[5]}</span></div><span class="pill s${st}">${['✔ Desbloqueada','◔ Em progresso','🔒 Bloqueada'][st]}</span><h3>${a[0]}</h3><p>${a[1]}</p>${u?'':`<div class="bar"><i style="width:${p/a[3]*100}%"></i></div><small style="text-align:right">${p} / ${a[3]}</small>`}<div class="ft"><b>★ +${a[2]} XP</b><small>${u?fmt(u):''}</small></div></div>`}
const stOf=i=>G.ach[i]?0:AC[i][4](G)>0?1:2;
function aside(){return `<div class="pl ops"><div class="hd"><b>▮ Operações (Temas)</b><button class="btn g" data-go="themes">Ver todos ›</button></div>${[[0,'+'],[8,'△'],[18,'∫']].map(([i,g])=>`<button class="op" data-c="${i}"><span class="ic">${g}</span><span><b>${C[i][0]}</b><small>${C[i][1].slice(0,3).map(s=>s[0]).join(', ')}…</small></span><em>›</em></button>`).join('')}</div>
<details class="pl how" open><summary>◎ Como funciona</summary><div class="sm"><div class="m bot"><span>Vamos praticar Álgebra? Qual é o valor de x na equação: 2x + 5 = 15 ?</span></div><div class="m me"><span>x = 5</span></div><div class="m bot ok"><span>Correto! 🎯 Você respondeu em 4,2 segundos. +6 XP</span></div></div><p class="mu">Responda no chat. Acerte com calma: a dificuldade e a consistência rendem XP. A velocidade não aumenta o XP por resposta. Com XP você sobe de patente.</p><div class="hw"><span>★<small>Primeira resposta</small></span><span>◎<small>Sequência de respostas</small></span><span>⚡︎<small>Velocidade de resposta</small></span><span>⏱︎<small>Tempo de sessão</small></span></div></details>`}

/* ---------- telas ---------- */
const themeCards=()=>cat<0?C.map((x,i)=>`<button class="pl card${i==18?' max':''}" data-c="${i}"><span class="ic">${String(i+1).padStart(2,'0')}</span><span><b>${x[0]}</b><small>${x[1].length} temas${i==18?', nível mais alto':''}</small></span></button>`).join(''):C[cat][1].map((x,j)=>`<button class="pl card" data-s="${j}"><span class="ic">${j+1}</span><span><b>${x[0]}</b></span></button>`).join('')+'<button class="pl card" data-s="-1"><span class="ic">?</span><span><b>Misto</b><small>Todos os temas</small></span></button>';
const VW={
home:()=>hdr('Seu campo de evolução',`Bem-vindo de volta, ${esc(G.nome)}. Escolha sua próxima missão.`)+rankCard()+progressionCard()+`<div class="pl pd"><h2>Missão rápida</h2><p class="mu">Questões sorteadas de todas as operações.</p><div class="acts"><button class="btn" data-a="mixall">▶ Modo misto</button><button class="btn g" data-go="themes">Escolher operação</button></div></div>`+`<div class="ag">${AC.map((a,i)=>[a,i,stOf(i)]).filter(x=>x[2]==1).slice(0,2).map(x=>achCard(...x)).join('')}</div>`,
themes:()=>hdr(cat<0?'Operações':C[cat][0],cat<0?'Escolha uma categoria. Pratique um tema ou misture categorias.':'Escolha um tema ou misture todos.')+(cat<0?'':'<button class="btn g" data-a="back" style="align-self:flex-start">‹ Categorias</button>')+`<div class="grid">${themeCards()}</div>`,
ach:()=>{const L=AC.map((a,i)=>[a,i,stOf(i)]),T=['Todas','Desbloqueadas','Em progresso','Bloqueadas'],n=[L.length,...[0,1,2].map(s=>L.filter(x=>x[2]==s).length)];
  return hdr('Conquistas','Resolva problemas, melhore seu desempenho e suba de patente.')+rankCard()+`<div class="tabs">${T.map((t,k)=>`<button class="tab${flt==k?' on':''}" data-f="${k}">${t} (${n[k]})</button>`).join('')}</div><div class="ag">${L.filter(x=>!flt||x[2]==flt-1).map(x=>achCard(...x)).join('')}</div>`},
stats:()=>{const T=[['Perguntas respondidas',G.tot],['Acertos',G.ok],['Precisão',(G.tot?Math.round(G.ok/G.tot*100):0)+'%'],['Velocidade média',G.tot?f(G.sum/G.tot):'—'],['Melhor sequência',G.best],['Missões concluídas',G.rounds],['Missões perfeitas',G.br],['Resposta mais rápida',G.ok?f(G.mt):'—']];
  return hdr('Estatísticas','Seu desempenho em campo.')+`<div class="tiles">${T.map(t=>`<div class="pl tile"><small>${t[0]}</small><b>${t[1]}</b></div>`).join('')}</div><div class="pl pd"><h2>Desempenho por operação</h2>${C.map((c,i)=>{const s=G.cats[i];return s?`<div class="row"><span>${c[0]}</span><div class="bar"><i style="width:${s[1]/s[0]*100}%"></i></div><small>${s[1]}/${s[0]}</small></div>`:''}).join('')||'<p class="mu">Nenhuma missão cumprida ainda.</p>'}</div>`},
prof:()=>{const i=rk(G.xp);return hdr('Perfil','Sua ficha de soldado.')+`<div class="pl pf">${badge(i,110)}<div><small>Nome de guerra</small><br><input id="nome" value="${esc(G.nome)}" maxlength="20"><p style="margin-top:8px"><b class="gd">${RK[i][0]}</b>, nível ${lv()}, ${G.xp} XP</p></div></div><div class="pl pd"><h2>Sua trilha de patentes</h2><p class="mu">Patentes exigem cada vez mais prática. O progresso antigo é convertido uma única vez, preservando sua patente e a proporção até a próxima.</p><div class="rl">${RK.map((r,k)=>`<div class="rr${k<=i?' on':''}">${badge(k,32)}<span>${r[0]}</span><small>${r[1]} XP</small></div>`).join('')}</div></div>`},
set:()=>hdr('Configurações','Ajuste a missão.')+`<div class="pl pd"><h2>Apoio visual</h2><p class="mu">Diagramas construídos a partir de cada questão. Ative para aprender visualmente ou desative para praticar só com o enunciado.</p><div class="acts"><button class="btn" data-a="visuals">${G.visuals?'Ativado · desativar':'Desativado · ativar'}</button></div></div><div class="pl pd"><h2>Questões por missão</h2><div class="acts">${[5,10,20].map(n=>`<button class="btn${G.N==n?'':' g'}" data-a="n${n}">${n}</button>`).join('')}</div></div><div class="pl pd"><h2>Zerar progresso</h2><p class="mu">Apaga XP, patente e conquistas deste navegador.</p><div class="acts"><button class="btn g" data-a="reset">${rs?'Toque de novo para confirmar':'Zerar progresso'}</button></div></div>`
};
function strip(){const i=rk(G.xp),n=RK[i+1],c=RK[i][1];$('#strip').innerHTML=`${badge(i,30)}<b>${RK[i][0]}</b><div class="bar"><i style="width:${n?(G.xp-c)/(n[1]-c)*100:100}%"></i></div><small>${G.xp}${n?' / '+n[1]:''} XP</small>`}
function draw(){document.body.classList.toggle('visuals-on',G.visuals);$$('.nv').forEach(b=>b.classList.toggle('on',b.dataset.go==V));const p=V=='play';$('#play').hidden=!p;$('#cols').hidden=p;
  if(p)return strip();
  $('#page').innerHTML=VW[V]();const a=V=='home'||V=='ach';$('#aside').hidden=!a;if(a)$('#aside').innerHTML=aside();
  if(lastV!=V)$('#main').scrollTop=0;lastV=V}
function pause(){if(S.on&&S.pa===null)S.pa=performance.now();controls();tick()}
function resume(){if(S.on&&S.pa!==null){S.t0+=performance.now()-S.pa;S.pa=null}controls();if(S.on&&innerWidth>820)$('#in').focus({preventScroll:true})}
function go(v){if(V==='course'&&v!=='course'){coursePauseClock();save()}if(V==='play'&&v!=='play')pause();if(v==='play'&&!S.t)return mix();rs=0;V=v;draw();controls();courseStartClock()}
function controls(){
  const paused=S.on&&S.pa!==null,answering=S.on&&!paused;
  $('#pause-panel').hidden=!paused;$('#in').disabled=!answering;$('#go').disabled=!answering;$('#skip').disabled=!answering;
  $('#pause').hidden=!answering;$('#next').hidden=!S.waiting;
  $('#next').textContent=S.i>=S.N?'Ver resultado':'Próxima questão';
}

/* ---------- jogo ---------- */
function add(cls,txt){const d=document.createElement('div');d.className='m '+cls;const t=document.createElement('span');t.textContent=txt;d.append(t);
  if(!/sys/.test(cls)){const tm=document.createElement('time');tm.textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+(cls=='me'?' ✓':'');d.append(tm)}
  $('#chat').append(d);$('#chat').scrollTop=1e9}
function elapsed(){return S.on?Math.max(0,((S.pa??performance.now())-S.t0)/1000):S.e||0}
function tick(){const e=elapsed();$('#tm').textContent=f(e);$('#tt').textContent=f((S.sum||0)+(S.on?e:0))}
const mix=()=>start({n:'Modo misto',all:1,g:d=>{const ci=R(0,C.length-1),r=pick(C[ci][1])[1](d);r.ci=ci;return r}},0);
function start(t,ci){clearInterval(S.iv);S={t,ci,N:G.N,i:0,ok:0,run:0,xp:0,answerXP:0,achievementXP:0,sum:0,d:1,on:false,e:0,pa:null,waiting:false,ended:false,seen:new Set()};V='play';
  $('#chat').innerHTML='';$('#ttl').textContent=t.all?'Modo misto: todas as operações':C[ci][0]+': '+t.n;$('#pt').textContent=0;draw();
  add('bot',`Missão de ${S.N} questões. Observe o desenho, resolva e avance no seu ritmo. Acertos: 6 / 8 / 10 XP. A dificuldade sobe a cada 3 acertos. Pular conta como erro; pausas não contam no tempo.`);S.iv=setInterval(tick,100);next()}
function next(){
  if(!S.t||S.on||S.ended)return;
  S.waiting=false;if(S.i>=S.N)return end();
  let q;for(let attempt=0;attempt<80;attempt++){
    q=S.t.g(S.d);
    if(!q||typeof q.q!=='string'||(q.type==='binary'?!/^[01]+$/.test(q.a):!Number.isFinite(q.a)))throw new Error('Questão inválida');
    if(!S.seen.has(q.q))break;
  }
  S.cur=q;S.seen.add(q.q);S.i++;$('#qn').textContent=S.i+'/'+S.N;
  $$('.question-card').forEach(card=>{card.classList.add('past');const d=card.querySelector('details');if(d)d.open=false});add('sys',`Questão ${S.i} · ${['Fundamentos','Desenvolvimento','Desafio'][S.d-1]} · ${[6,8,10][S.d-1]} XP por acerto`);const currentCard=addQuestion(q);S.t0=performance.now();S.pa=null;S.on=true;S.e=0;
  $('#answer-help').textContent=q.type==='binary'?'Digite somente 0 e 1. Zeros à esquerda são aceitos.':'Use decimal com vírgula ou ponto, ou fração exata (ex.: 1/3). Não use separadores de milhar.';
  $('#in').value='';controls();tick();if(document.hidden||V!=='play')pause();else if(innerWidth>820)$('#in').focus({preventScroll:true});if(innerWidth<=820)currentCard.scrollIntoView({block:'start'});
}
// Grammar-only parser: no eval, coercion of empty operands, or arbitrary expressions.
function rational(raw){
  let s=String(raw).trim().replace(/[−–]/g,'-').replace(/^(?:x|y|m|b)\s*=\s*/i,'');
  if(!s||s.length>120)return null;
  const parts=s.split('/');if(parts.length>2)return null;
  function decimal(v){v=v.trim();if(!/^[+-]?(?:\d+(?:[.,]\d+)?|[.,]\d+)$/.test(v))return null;v=v.replace(',','.');const neg=v[0]==='-';v=v.replace(/^[+-]/,'');const [i,f='']=v.split('.');return [BigInt((i||'0')+f)*(neg?-1n:1n),10n**BigInt(f.length)]}
  const a=decimal(parts[0]),b=parts.length===2?decimal(parts[1]):[1n,1n];if(!a||!b||b[0]===0n)return null;return [a[0]*b[1],a[1]*b[0]];
}
function checkAnswer(raw,q){
  if(q.type==='binary'){const v=raw.trim();return /^[01]+$/.test(v)?{valid:true,correct:v.replace(/^0+(?=.)/,'')===q.a}:{valid:false}}
  const v=rational(raw),a=rational(q.s??String(q.a));
  return {valid:!!v,correct:!!v&&!!a&&v[0]*a[1]===a[0]*v[1]};
}
function after(){chk().forEach(a=>{add('sys',`🏅 Conquista desbloqueada: ${a[0]} (+${a[2]} XP)`);toast(`🏅 ${a[0]}  +${a[2]} XP`)});
  if(promo!=null){add('sys',`⭐ PROMOÇÃO! Você agora é ${RK[promo][0]}.`);toast(`⭐ Promovido a ${RK[promo][0]}!`);promo=null}$('#pt').textContent=S.xp||0;strip();save()}
function send(skip=false){if(!S.on||S.pa!==null||V!=='play'||document.hidden)return;const raw=$('#in').value.trim();if(!skip&&!raw)return;const verdict=skip?{valid:true,correct:false}:checkAnswer(raw,S.cur);if(!verdict.valid){toast('Formato inválido. Use o formato indicado abaixo da questão.');$('#in').focus();return;}
  const e=elapsed(),ci=S.cur.ci??S.ci,c=G.cats[ci]||(G.cats[ci]=[0,0]);S.on=false;S.e=e;S.sum+=e;add('me',skip?'Pular':raw);c[0]++;G.tot++;G.sum+=e;
  if(verdict.correct){S.run++;const reward=answerXP(S.d,S.run),x=reward.base+reward.consistency;c[1]++;G.ok++;S.ok++;G.streak++;G.best=Math.max(G.best,G.streak);
    G.f5=e<5?G.f5+1:0;G.f8=e<8?G.f8+1:0;G.bf5=Math.max(G.bf5,G.f5);G.bf8=Math.max(G.bf8,G.f8);G.mt=G.ok===1?e:Math.min(G.mt,e);if(ci==18)G.cok++;
    gain(x);S.xp+=x;S.answerXP+=x;add('bot ok',`Correto! 🎯 Muito bem! Você respondeu em ${f(e)}. +${reward.base} XP${reward.consistency?" +2 XP por 5 acertos seguidos":""}`);
    if(S.d<3&&S.ok%3==0){S.d++;add('sys','A dificuldade aumentou!')}}
  else{S.run=0;G.streak=G.f5=G.f8=0;add('bot bad',`${skip?'Você pulou':'Errou'}. A resposta era ${S.cur.s??S.cur.a}. Tempo: ${f(e)}.`)}
  sessionSeconds+=e;G.bs=Math.max(G.bs,sessionSeconds/60);$('#in').value='';S.waiting=true;after();controls();tick();$('#next').focus()}
function end(){if(S.ended)return;S.on=false;S.waiting=false;S.e=0;clearInterval(S.iv);G.rounds++;if(S.ok===S.N)G.br++;S.finishXP=finishXP(S.ok,S.N);gain(S.finishXP);S.xp+=S.finishXP;after();S.ended=true;
  add('bot',`🏁 Missão cumprida! Acertos: ${S.ok} de ${S.N}. XP total: ${S.xp} (${S.answerXP} por respostas e sequências + ${S.finishXP} por conclusão + ${S.achievementXP} de conquistas). Tempo ativo: ${f(S.sum)}. Média: ${f(S.sum/S.N)} por questão.`);
  const b=document.createElement('div');b.className='acts';b.innerHTML='<button class="btn" data-a="again">Nova missão</button><button class="btn g" data-go="themes">Trocar tema</button>';$('#chat').append(b);$('#chat').scrollTop=1e9;controls();tick();b.querySelector('button').focus()}

/* ---------- eventos ---------- */
$('#go').onclick=()=>send();$('#skip').onclick=()=>send(true);
$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.repeat&&!e.isComposing){e.preventDefault();send()}};
$('#next').onclick=()=>next();$('#pause').onclick=pause;$('#resume').onclick=resume;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
window.addEventListener('pagehide',()=>{pause();save()});
document.addEventListener('input',e=>{if(e.target.id=='nome'){G.nome=e.target.value.trim()||'Soldado';save()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-c],[data-s],[data-f],[data-a]');if(!t)return;const d=t.dataset;
  if(d.go){if(d.go=='themes'&&t.classList.contains('nv'))cat=-1;return go(d.go)}
  if(d.c!==undefined){cat=+d.c;return go('themes')}
  if(d.s!==undefined){const sub=C[cat][1],j=+d.s;return start(j<0?{n:'Misto',g:x=>pick(sub)[1](x)}:{n:sub[j][0],g:sub[j][1]},cat)}
  if(d.f!==undefined)flt=+d.f;
  const a=d.a;if(a=='mixall')return mix();if(a=='again')return start(S.t,S.ci);
  if(a==='visuals'){G.visuals=!G.visuals;save()}else if(a=='back')cat=-1;else if(a&&a[0]=='n'){G.N=+a.slice(1);save()}
  else if(a=='reset'){if(!rs){rs=1;setTimeout(()=>{rs=0;if(V==='set')draw()},5000)}else{clearInterval(S.iv);S={};G=fresh();courseClock=null;coursePage="map";sessionSeconds=0;promo=null;rs=0;save()}}
  draw()});
initCourseMode();
draw();
if(!storageWarning)save();
if(storageWarning)toast('Progresso indisponível ou inválido. O jogo iniciou com os dados padrão.');
</script>
</body>
