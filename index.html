<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartas</title>
<style>
:root{--bg:#d9e1e8;--page:#fff;--fg:#222;--mute:#666;--line:#b9c4cf;--link:#0645ad;--bar:#2b4a6f;--stage:#eef1f4;--card:#fff;--soft:#f4f6f8;--warn:#b3261e;--ok:#2e7d32;--okbg:#e3f2e4;--badbg:#fbe4e2;--pill:#f7d9ee;--pillfg:#b0307f;--b1:#e1ecff;--b2:#fdebdc;--b3:#e6e0f3;--b4:#e5efdc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1f25;--page:#232a31;--fg:#e8e8e8;--mute:#9aa4ad;--line:#3a444e;--link:#8ab4f8;--bar:#1b3350;--stage:#1d242b;--card:#2b333b;--soft:#2a323a;--warn:#ff8a80;--ok:#81c784;--okbg:#203a22;--badbg:#44211f;--pill:#4a2a40;--pillfg:#f3a6d6;--b1:#27384f;--b2:#4a3626;--b3:#3a3350;--b4:#2f4128}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 Verdana,Geneva,Arial,sans-serif}
a{color:var(--link);cursor:pointer;text-decoration:underline}
#top{background:var(--bar);color:#fff;padding:10px 0;border-bottom:3px solid #1b3350}
#top div,#wrap{max-width:760px;margin:0 auto;padding:0 16px}
#top a{color:#fff;text-decoration:none;font:bold 20px Georgia,serif}
#top small{color:#b9cde4;margin-left:10px}
#wrap{background:var(--page);border:1px solid var(--line);border-top:0;padding:16px 16px 28px;min-height:70vh}
h2{font-size:15px;margin:0 0 8px}
.crumb{margin-bottom:14px;color:var(--mute)}
.bar{background:var(--soft);border:1px solid var(--line);padding:6px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sp{flex:1}.mute{color:var(--mute)}.w{color:var(--warn)}
button,.btn{font:12px Verdana,Arial,sans-serif;color:var(--fg);background:linear-gradient(#fff,#e2e6ea);border:1px solid #8a96a3;border-radius:3px;padding:4px 10px;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{background:linear-gradient(#3a444e,#2b333b);border-color:#55616d}}
button:hover{border-color:var(--link)}button:disabled{opacity:.45;cursor:default}
button.p{background:linear-gradient(#4f86c6,#2e5f9e);border-color:#234c7f;color:#fff;font-weight:bold}
input,textarea,select{font:13px Verdana,Arial,sans-serif;color:var(--fg);background:var(--card);border:1px solid #8a96a3;padding:5px;width:100%}
textarea{min-height:56px;resize:vertical}
label{display:block;font-weight:bold;margin:8px 0 2px}
.box{border:1px solid var(--line);margin:14px 0}
.box>h2{background:var(--soft);padding:6px 8px;margin:0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.box>h2 span{font-weight:normal;font-size:11px;color:var(--mute)}
.r{display:flex;align-items:center;gap:8px;padding:7px 8px;border-bottom:1px solid var(--line)}
.r:last-child{border:0}.r:nth-child(even){background:var(--soft)}
.r .t{flex:1;min-width:0;overflow-wrap:anywhere}
.help{background:#fffbe0;color:#333;border:1px solid #e0d68a;padding:10px 14px;margin-bottom:14px}
.help ol{margin:6px 0 0 18px;padding:0}
.add{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.form{padding:4px 12px 12px}
.stage{background:var(--stage);padding:16px;border:1px solid var(--line);margin-top:10px}
.card{background:var(--card);border-radius:16px;padding:22px;min-height:340px;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{background:var(--pill);color:var(--pillfg);font-weight:bold;border-radius:20px;padding:5px 14px 5px 10px;font-size:12px}
.pill:before{content:"";display:inline-block;width:11px;height:11px;border:2px solid var(--pillfg);border-radius:50%;margin-right:6px;vertical-align:-2px}
.ch button{border-radius:20px;background:var(--card);padding:5px 12px}
.ch button.c{width:30px;height:30px;padding:0;border-radius:50%;font-size:14px}
.q{font-size:17px;line-height:1.55;margin:26px 0 12px;white-space:pre-wrap;overflow-wrap:anywhere;flex:1}
.hint{background:var(--soft);border-left:3px solid var(--link);padding:6px 10px;margin:0 0 12px}
.ans{border-top:1px solid var(--line);padding-top:12px;margin-top:6px;font-size:16px;white-space:pre-wrap}
.lab{font-weight:bold;margin:8px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font-size:14px;padding:12px;border:1px solid var(--fg);border-radius:12px;background:var(--card);min-height:56px}
.opt i{font-style:normal;font-weight:bold;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.opt:nth-child(1) i{background:var(--b1)}.opt:nth-child(2) i{background:var(--b2)}.opt:nth-child(3) i{background:var(--b3)}.opt:nth-child(4) i{background:var(--b4)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.no{background:var(--badbg);border-color:var(--warn)}
.fb{padding:8px 10px;margin:8px 0;border:1px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}.fb.no{background:var(--badbg);border-color:var(--warn)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.grades button{padding:8px 2px;line-height:1.3}.grades small{display:block;color:var(--mute)}
.grades button.rec{border:2px solid var(--link)}
.prog{height:6px;background:var(--line)}.prog i{display:block;height:100%;background:var(--link)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov{overflow:auto}.ov>div{background:var(--page);border:1px solid var(--line);padding:16px;max-width:360px;width:100%}.ov>div.dr{max-width:940px}
.ov p{margin:0 0 14px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.tb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--soft);border:1px solid #8a96a3;border-bottom:0;padding:4px;font-size:11px}
.tb button{padding:2px 7px}.tb .sw{width:16px;height:16px;padding:0;border-radius:2px;border:1px solid #666}
.ed{border:1px solid #8a96a3;background:var(--card);min-height:70px;padding:8px;overflow-wrap:anywhere;outline:none}.ed:focus{border-color:var(--link)}
.ed:empty:before{content:attr(data-ph);color:var(--mute)}
.ed img,.q img,.ans img,.opt img,.fb img{max-width:100%;height:auto;border-radius:4px;vertical-align:middle}
.ed img{cursor:pointer}.ed img.sel{outline:2px solid var(--link);outline-offset:1px}
#itb{position:absolute;z-index:8;background:var(--page);border:1px solid #8a96a3;padding:6px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.3);max-width:94vw}
.dr canvas{width:100%;height:auto;border:1px solid #8a96a3;background:#fff;cursor:crosshair;touch-action:none;display:block;margin-top:8px}
</style>
</head>
<body>
<div id="top"><div><span id="pfw" style="float:right;font-size:12px"></span><a onclick="A.home()">Cartas</a><small>flashcards com revisão espaçada</small></div></div>
<div id="wrap"></div>
<input type="file" id="fi" accept="image/*" style="display:none">
<input type="file" id="fj" accept=".json,application/json" style="display:none">
<script>
(function(){
var DAY=864e5,MIN=6e4,PK="flashcards.profiles",DK="flashcards.p.",UC=0,IDX=null,ST=null;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
var STOR=lsSet("_t","1");try{localStorage.removeItem("_t")}catch(e){}
var P=null;try{P=JSON.parse(lsGet(PK))}catch(e){}
if(!P||!P.list||!P.list.length||!P.cur){P={list:[{id:"p1",name:"Meu perfil"}],cur:"p1"};var old=lsGet("flashcards.v1");if(old)lsSet(DK+"p1",old);lsSet(PK,JSON.stringify(P))}
if(!P.list.some(function(x){return x.id===P.cur}))P.cur=P.list[0].id;
function loadS(){try{var p=JSON.parse(lsGet(DK+P.cur));if(p&&Array.isArray(p.cards)&&Array.isArray(p.decks)&&Array.isArray(p.folders))return p}catch(e){}return{folders:[],decks:[],cards:[]}}
var S=loadS();
function save(){clearTimeout(ST);ST=null;IDX=null;return lsSet(DK+P.cur,JSON.stringify(S))}
function saveLater(){clearTimeout(ST);ST=setTimeout(save,500)}
function flush(){if(ST)save()}
function savePk(){lsSet(PK,JSON.stringify(P))}
function uid(){return Date.now().toString(36)+(UC++).toString(36)+Math.random().toString(36).slice(2,5)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(s){return document.querySelector(s)}
var OK={B:1,I:1,U:1,S:1,STRIKE:1,STRONG:1,EM:1,BR:1,DIV:1,P:1,UL:1,OL:1,LI:1,SPAN:1,FONT:1,MARK:1,IMG:1,SUB:1,SUP:1};
function clean(n){var out=document.createDocumentFragment();
  n.childNodes.forEach(function(ch){
    if(ch.nodeType===3){out.appendChild(document.createTextNode(ch.nodeValue));return}
    if(ch.nodeType!==1)return;var t=ch.tagName;
    if(!OK[t]){out.appendChild(clean(ch));return}
    var e=document.createElement(t.toLowerCase());
    if(t==="IMG"){var s=ch.getAttribute("src")||"";if(/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(s))e.setAttribute("src",s);else return;var wm=(ch.getAttribute("style")||"").match(/width:\s*(\d{1,4}(?:\.\d+)?(?:px|%))/);if(wm)e.setAttribute("style","width:"+wm[1]+";height:auto")}
    else{var st=ch.getAttribute("style");if(st){var keep=[];st.split(";").forEach(function(d){var m=d.split(":"),k=(m[0]||"").trim().toLowerCase(),v=m.slice(1).join(":").trim();
      if(/^(color|background-color|font-weight|font-style|text-decoration(-line)?)$/.test(k)&&/^[#\w\s(),.%-]+$/.test(v)&&!/url|expression/i.test(v))keep.push(k+":"+v)});if(keep.length)e.setAttribute("style",keep.join(";"))}
      if(t==="FONT"){var col=ch.getAttribute("color");if(/^#?[0-9a-z]{3,20}$/i.test(col||""))e.setAttribute("color",col)}
      e.appendChild(clean(ch))}
    out.appendChild(e)});return out}
function sanitize(h){var d=new DOMParser().parseFromString(h,"text/html");d.querySelectorAll("script,style").forEach(function(x){x.remove()});var w=document.createElement("div");w.appendChild(clean(d.body));return w.innerHTML}
var RC=new Map();
function rich(s){s=String(s);var h=RC.get(s);if(h!==undefined)return h;
  h=/<[a-z][\s\S]*>/i.test(s)?sanitize(s):esc(s).replace(/\n/g,"<br>");if(RC.size>150)RC.clear();RC.set(s,h);return h}
function plain(s){s=String(s);if(!/<[a-z]/i.test(s))return s;return new DOMParser().parseFromString(s,"text/html").body.textContent}
function prv(h){return plain(h).slice(0,90)+(/<img/i.test(h)?" [imagem]":"")}
function hasC(h){return plain(h).trim()!==""||/<img/i.test(h)}
var W=$("#wrap"),V={page:"home",type:"basic"},Q=null;
var TYPES={basic:"Cartão",mc:"Múltipla escolha",typed:"Digite a resposta"};

// Repetição espaçada: variante do SM-2 (Wozniak, 1990). g: 0 Errei, 1 Difícil, 2 Bom, 3 Fácil
function sched(c,g){
  var now=Date.now(),ef=c.ef||2.5,reps=c.reps||0,iv=c.interval||0,lap=c.lapses||0,i;
  if(g===0)return{reps:0,interval:0,ef:Math.max(1.3,ef-.2),lapses:lap+1,due:now+10*MIN};
  var q=[0,3,4,5][g];ef=Math.max(1.3,ef+(.1-(5-q)*(.08+(5-q)*.02)));
  if(reps===0)i=g===3?4:1;else if(reps===1)i=g===1?4:g===3?8:6;else i=iv*(g===1?1.2:ef*(g===3?1.3:1));
  i=Math.max(1,Math.round(i));if(reps>1&&i<=iv)i=iv+1;
  return{reps:reps+1,interval:i,ef:ef,lapses:lap,due:now+i*DAY};
}
function fmt(ms){var m=ms/MIN;if(m<60)return Math.round(m)+" min";var d=ms/DAY;
  if(d<30)return Math.round(d)+(Math.round(d)===1?" dia":" dias");
  if(d<365)return Math.round(d/30)+(Math.round(d/30)===1?" mês":" meses");return (d/365).toFixed(1).replace(".",",")+" anos"}
function prev(c,g){return fmt(sched(c,g).due-Date.now())}
function resetCard(c){c.due=null;c.ef=2.5;c.interval=0;c.reps=0;c.lapses=0}

function decksIn(f){return S.decks.filter(function(d){return (d.folderId||null)===f})}
function idx(){if(!IDX){IDX={};S.cards.forEach(function(c){(IDX[c.deckId]=IDX[c.deckId]||[]).push(c)})}return IDX}
function cardsOfDeck(id){return idx()[id]||[]}
function cardsOfFolder(f){return decksIn(f).reduce(function(a,d){return a.concat(cardsOfDeck(d.id))},[])}
function stats(cs){var n=Date.now(),a=0,b=0;cs.forEach(function(c){if(c.due==null)a++;else if(c.due<=n)b++});return{nw:a,du:b,t:cs.length}}
function dueList(cs){var n=Date.now();return cs.filter(function(c){return c.due==null||c.due<=n}).sort(function(a,b){return (a.due==null?1:0)-(b.due==null?1:0)||(a.due||0)-(b.due||0)})}
function info(cs){var s=stats(cs);return '<span class="mute">'+s.nw+' novas · '+s.du+' para revisar · '+s.t+' no total</span>'}
function nrm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g,"").replace(/\s+/g," ").trim()}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function mcOpts(c){var w=(c.wrong||[]).filter(Boolean);
  if(w.length<3){var o=cardsOfDeck(c.deckId).map(function(x){return x.back}).filter(function(b,i,ar){return b!==c.back&&w.indexOf(b)<0&&ar.indexOf(b)===i});w=w.concat(shuf(o)).slice(0,3)}
  return shuf([c.back].concat(w))}
function ask(msg,ok,cb){var o=document.createElement("div");o.className="ov";
  o.innerHTML='<div><p>'+esc(msg)+'</p><div style="border:0;padding:0;display:flex;gap:6px;justify-content:flex-end"><button id="n">Cancelar</button><button id="y" class="p">'+esc(ok)+'</button></div></div>';
  document.body.appendChild(o);o.querySelector("#n").onclick=function(){o.remove()};o.querySelector("#y").onclick=function(){o.remove();cb()}}

var A={
  home:function(){V={page:"home",type:V.type};Q=null;render()},
  open:function(id){V={page:"deck",id:id,type:V.type};render()},
  addFolder:function(){var n=$("#nf").value.trim();if(!n)return;S.folders.push({id:uid(),name:n});save();render()},
  addDeck:function(f){var n=document.getElementById("nd-"+(f||"x")).value.trim();if(!n)return;var d={id:uid(),folderId:f,name:n};S.decks.push(d);save();V={page:"deck",id:d.id,type:V.type};render()},
  delFolder:function(id){ask("Excluir esta pasta e todos os decks e cartas dentro dela?","Excluir",function(){
    var ids=decksIn(id).map(function(d){return d.id});
    S.cards=S.cards.filter(function(c){return ids.indexOf(c.deckId)<0});S.decks=S.decks.filter(function(d){return d.folderId!==id});
    S.folders=S.folders.filter(function(f){return f.id!==id});save();render()})},
  delDeck:function(id){ask("Excluir este deck e todas as suas cartas?","Excluir",function(){
    S.cards=S.cards.filter(function(c){return c.deckId!==id});S.decks=S.decks.filter(function(d){return d.id!==id});save();A.home()})},
  move:function(id,f){S.decks.filter(function(d){return d.id===id})[0].folderId=f||null;save();render()},
  type:function(t){V.type=t;$("#mcb").style.display=t==="mc"?"block":"none"},
  saveCard:function(){
    var f=sanitize($("#cf").innerHTML).trim(),b=sanitize($("#cb").innerHTML).trim();if(!hasC(f)||!hasC(b)){alert("Preencha a frente e a resposta.");return}
    var data={type:V.type,front:f,back:b,hint:$("#ch").value.trim(),wrong:V.type==="mc"?[$("#w1").value.trim(),$("#w2").value.trim(),$("#w3").value.trim()].filter(Boolean):[]};
    if(V.edit){var c=S.cards.filter(function(x){return x.id===V.edit})[0];for(var k in data)c[k]=data[k];V.edit=null}
    else{data.id=uid();data.deckId=V.id;data.star=false;data.created=Date.now();resetCard(data);S.cards.push(data)}
    if(!save())alert("Sem espaço no navegador: as imagens ocupam muito. Remova imagens ou cartas antigas.");render();$("#cf").focus()},
  edit:function(id){var c=S.cards.filter(function(x){return x.id===id})[0];V.edit=id;V.type=c.type||"basic";render();
    $("#cf").innerHTML=rich(c.front);$("#cb").innerHTML=rich(c.back);$("#ch").value=c.hint||"";(c.wrong||[]).forEach(function(w,i){$("#w"+(i+1)).value=w});$("#cf").focus();window.scrollTo(0,0)},
  cancelEdit:function(){V.edit=null;render()},
  delCard:function(id){S.cards=S.cards.filter(function(c){return c.id!==id});save();render()},
  star:function(id){var c=S.cards.filter(function(x){return x.id===id})[0];c.star=!c.star;save();render()},
  reset:function(l,cs){ask("Resetar a revisão espaçada de "+l+"? Todas as cartas voltam a ser novas e o progresso é apagado.","Resetar",function(){cs.forEach(resetCard);save();render()})},
  study:function(cs){var l=dueList(cs);if(!l.length)return;Q={ids:l.map(function(c){return c.id}),total:l.length,done:0,back:{page:V.page,id:V.id,type:V.type}};V={page:"review",type:V.type};render()},
  exit:function(){V=Q.back;Q=null;render()},
  hint:function(){Q.hint=true;render()},
  say:function(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";speechSynthesis.speak(u)}catch(e){}},
  show:function(){Q.show=true;render()},
  pick:function(i){if(Q.picked!=null)return;Q.picked=i;var c=cur();Q.g=Q.opts[i]===c.back?(Q.hint?1:2):0;render()},
  check:function(){var c=cur(),v=$("#ti").value;Q.checked=true;Q.ok=nrm(v)===nrm(plain(c.back));Q.typed=v;render()},
  grade:function(g){var c=cur();if(c){var s=sched(c,g);for(var k in s)c[k]=s[k];saveLater();if(g===0)Q.ids.push(c.id);else Q.done++}Q.ids.shift();Q.cid=null;render()}
};
window.A=A;window.plain=plain;
// ---- Perfis, backup em arquivo e importação ----
function me(){return P.list.filter(function(x){return x.id===P.cur})[0]}
function drawProf(){var el=$("#pfw");if(el)el.innerHTML='Perfil: <select onchange="A.prof(this.value)" style="width:auto;max-width:170px;padding:2px">'+P.list.map(function(x){return '<option value="'+x.id+'"'+(x.id===P.cur?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select>'}
function warn(){var h="",m=me();
  if(!STOR)h+='<div class="help" style="background:#fde8e6;border-color:#e0a8a2">Este navegador está bloqueando o armazenamento local: o que você criar pode se perder ao fechar. Use "Salvar arquivo no computador" (no fim da página) para guardar seus dados.</div>';
  else if(S.cards.length&&(!m.bk||Date.now()-m.bk>14*DAY))h+='<div class="help">Faça um backup: salve um arquivo no computador (no fim da página) para não perder seus cartões.</div>';
  return h}
function backupBox(){var m=me();
  return '<div class="box"><h2>Perfil e backup <span>perfil atual: '+esc(m.name)+'</span></h2><div class="form"><p class="mute">Seus dados ficam salvos neste navegador, no perfil escolhido no topo da página. Para guardar uma cópia no computador, ou levar tudo para outro aparelho, salve um arquivo e abra-o depois aqui.</p>'
   +'<div class="bar" style="margin-bottom:8px"><button class="p" onclick="A.export()">Salvar arquivo no computador</button><button onclick="A.pickFile()">Abrir arquivo salvo</button><span class="mute">'+(m.bk?'Último backup: '+new Date(m.bk).toLocaleDateString("pt-BR"):'Nenhum backup ainda')+'</span></div>'
   +'<div class="bar"><span class="mute">Perfis:</span><button onclick="A.newProf()">Novo perfil</button><button onclick="A.renProf()">Renomear</button><button class="w" onclick="A.delProf()">Excluir perfil</button></div></div></div>'}
function modal(msg,val,btns){var o=document.createElement("div");o.className="ov";
  o.innerHTML='<div><p>'+esc(msg)+'</p>'+(val!=null?'<input id="mi" maxlength="60" style="margin-bottom:12px">':'')+'<div class="bb" style="border:0;padding:0;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap"></div></div>';
  var bx=o.querySelector(".bb"),i=o.querySelector("#mi");

  h+='<div class="box"><h2>'+(ed?'Editar carta':'Adicionar carta')+'</h2><div class="form"><label>Tipo de carta</label><select onchange="A.type(this.value)">'+Object.keys(TYPES).map(function(k){return '<option value="'+k+'"'+(t===k?' selected':'')+'>'+TYPES[k]+'</option>'}).join('')+'</select>'
   +'<label>Frente (pergunta ou definição)</label>'+edt("cf","Escreva a pergunta. Cole ou insira imagens e clique nelas para redimensionar, cortar ou excluir.")+'<label>Resposta correta</label>'+edt("cb","Escreva a resposta.")
   +'<div id="mcb" style="display:'+(t==="mc"?'block':'none')+'"><label>Respostas erradas <span class="mute" style="font-weight:normal">(opcional: faltando, usamos respostas de outras cartas do deck)</span></label><input id="w1" placeholder="Errada 1"><input id="w2" placeholder="Errada 2" style="margin-top:4px"><input id="w3" placeholder="Errada 3" style="margin-top:4px"></div>'
   +'<label>Dica <span class="mute" style="font-weight:normal">(opcional)</span></label><input id="ch"><div style="margin-top:10px"><button class="p" onclick="A.saveCard()">'+(ed?'Salvar alterações':'Adicionar carta')+'</button> '+(ed?'<button onclick="A.cancelEdit()">Cancelar</button>':'')+'</div></div></div>';
  h+='<div class="box"><h2>Cartas deste deck <span>('+cs.length+')</span></h2>';
  if(!cs.length)h+='<div class="r mute">Nenhuma carta ainda. Use o formulário acima.</div>';
  cs.slice().reverse().forEach(function(c){var st=c.due==null?"nova":(c.due<=n?"para revisar":"volta em "+fmt(c.due-n));
    h+='<div class="r"><div class="t">'+(c.star?'★ ':'')+esc(prv(c.front))+'<br><span class="mute">'+esc(prv(c.back))+' · '+TYPES[c.type||"basic"]+' · '+st+'</span></div><a onclick="A.edit(\''+c.id+'\')">editar</a><a class="w" onclick="A.delCard(\''+c.id+'\')">excluir</a></div>'});
  return h+'</div>'}

function reviewPage(){
  var h='<div class="bar"><a onclick="A.exit()">« Sair da revisão</a><span class="sp"></span>'+Q.done+' de '+Q.total+' concluídas</div><div class="prog"><i style="width:'+(Q.total?Q.done/Q.total*100:0)+'%"></i></div>';
  if(!Q.ids.length)return h+'<div class="stage"><div class="card" style="min-height:240px;justify-content:center;align-items:center;text-align:center"><h2>Pronto! Tudo revisado por agora.</h2><p>'+Q.done+' cartas concluídas.</p><button class="p" onclick="A.exit()">Voltar</button></div></div>';
  var c=cur();if(!c){Q.ids.shift();return reviewPage()}
  if(Q.cid!==c.id){Q.cid=c.id;Q.show=false;Q.hint=false;Q.picked=null;Q.checked=false;Q.g=null;Q.opts=c.type==="mc"?mcOpts(c):null;if(Q.opts&&Q.opts.length<2)Q.opts=null;Q.t=Q.opts?"mc":(c.type==="typed"?"typed":"basic")}
  var pill=c.due==null?"Nova":(c.reps===0?"Reaprendendo":"Revisão"),id="'"+c.id+"'";
  h+='<div class="stage"><div class="card"><div class="ch"><span>'+TYPES[Q.t]+'</span><span class="sp"></span><span class="pill">'+pill+'</span>'
   +'<button '+(c.hint&&!Q.hint?'':'disabled')+' onclick="A.hint()">Dica</button><button class="c" title="Ouvir" onclick="A.say(plain(cur().front))">♪</button><button class="c" title="Favoritar" onclick="A.star('+id+')">'+(c.star?'★':'☆')+'</button></div>'
   +'<div class="q">'+rich(c.front)+'</div>'+(Q.hint?'<div class="hint">Dica: '+esc(c.hint)+'</div>':'');
  var grade=function(rec){var l=["Errei","Difícil","Bom","Fácil"];return '<div class="grades">'+l.map(function(x,g){return '<button class="'+(g===rec?'rec':'')+'" onclick="A.grade('+g+')">'+(g+1)+'. '+x+'<small>'+prev(c,g)+'</small></button>'}).join('')+'</div>'};
  if(Q.t==="mc"){
    h+='<div class="lab">Escolha a resposta correta</div><div class="opts">'+Q.opts.map(function(o,i){var k="";if(Q.picked!=null)k=o===c.back?" ok":(i===Q.picked?" no":"");return '<button class="opt'+k+'" '+(Q.picked!=null?'disabled':'')+' onclick="A.pick('+i+')"><i>'+(i+1)+'</i><span>'+rich(o)+'</span></button>'}).join('')+'</div>';
    if(Q.picked!=null)h+='<div class="fb '+(Q.g?'ok':'no')+'">'+(Q.g?'Correto!':'Errado. A resposta certa é: '+rich(c.back))+'</div><button class="p" onclick="A.grade('+Q.g+')">Continuar (Enter) — volta em '+prev(c,Q.g)+'</button>';
  }else if(Q.t==="typed"){
    if(!Q.checked)h+='<div class="lab">Digite a resposta</div><input id="ti" autocomplete="off" onkeydown="if(event.key===\'Enter\')A.check()"><div style="margin-top:8px"><button class="p" onclick="A.check()">Verificar (Enter)</button></div>';
    else h+='<div class="fb '+(Q.ok?'ok':'no')+'">'+(Q.ok?'Correto!':'Você digitou: '+esc(Q.typed||"(vazio)")+'<br>Resposta esperada: <b>'+rich(c.back)+'</b>')+'</div><div class="lab">Como foi?</div>'+grade(Q.ok?2:0);
  }else{
    if(!Q.show)h+='<button class="p" style="padding:9px" onclick="A.show()">Mostrar resposta (espaço)</button>';
    else h+='<div class="ans">'+rich(c.back)+'</div><div class="lab">Como foi?</div>'+grade(-1);
  }
  return h+'</div></div>'}

function render(){
  W.innerHTML=V.page==="review"&&Q?reviewPage():V.page==="deck"?deckPage():home();
  hideItb();drawProf();var i=$("#ti");if(i)i.focus();
}
window.render=render;Object.defineProperty(window,"S",{get:function(){return S}});window.cardsOfDeck=cardsOfDeck;window.cardsOfFolder=cardsOfFolder;window.cur=cur;
document.addEventListener("keydown",function(e){
  if(V.page!=="review"||!Q||!Q.ids.length||document.querySelector(".ov"))return;var t=e.target.tagName;if(t==="INPUT"||t==="TEXTAREA")return;
  var k=e.key;
  if(Q.t==="mc"){if(Q.picked==null&&"1234".indexOf(k)>-1&&k.length===1&&+k<=Q.opts.length){e.preventDefault();A.pick(+k-1)}else if(Q.picked!=null&&k==="Enter"){e.preventDefault();A.grade(Q.g)}}
  else if(Q.t==="basic"){if(!Q.show&&(k===" "||k==="Enter")){e.preventDefault();A.show()}else if(Q.show&&"1234".indexOf(k)>-1&&k.length===1){e.preventDefault();A.grade(+k-1)}}
  else if(Q.checked&&"1234".indexOf(k)>-1&&k.length===1){e.preventDefault();A.grade(+k-1)}
});
Object.defineProperty(window,"V",{get:function(){return V},set:function(v){V=v}});
render();
})();
</script>
</body>
