// Grammar-only parser: no eval, coercion of empty operands, or arbitrary expressions.
function rational(raw){
  let s=String(raw).trim().replace(/[−–]/g,'-').replace(/^(?:x|y|m|b)\s*=\s*/i,'');

  const parts=s.split('/');if(parts.length>2)return null;

  return {valid:!!v,correct:!!v&&!!a&&v[0]*a[1]===a[0]*v[1]};
}
