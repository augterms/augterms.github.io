/* Visuals read only the problem statement and topic, never the stored answer.
   Every generated topic carries stable category/topic identifiers. */
C.forEach((category,ci)=>category[1].forEach((topic,ti)=>{const generate=topic[1];topic[1]=d=>({...generate(d),ci,ti})}));
const nums=s=>(s.match(/-?\d+(?:\.\d+)?/g)||[]).map(Number);
const match=(s,re)=>{const m=s.match(re);if(!m)throw new Error('Formato visual não reconhecido: '+s);return m};
const label=(x,y,t,cls='vl',anchor='middle')=>`<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${esc(t)}</text>`;
const line=(x,y,u,v,cls='edge')=>`<line x1="${x}" y1="${y}" x2="${u}" y2="${v}" class="${cls}"/>`;
const dot=(x,y,r=5,cls='point')=>`<circle cx="${x}" cy="${y}" r="${r}" class="${cls}"/>`;
const polygon=(pts,cls='shape')=>`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" class="${cls}"/>`;
const svg=(body,description,h=250)=>`<svg viewBox="0 0 600 ${h}" role="img" aria-label="${esc(description)}">${body}</svg>`;
const chips=items=>`<div class="vchips">${items.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`;
const flow=items=>`<div class="vflow">${items.map((x,i)=>`${i?'<i aria-hidden="true">→</i>':''}<div>${esc(x)}</div>`).join('')}</div>`;
const panel=(title,body,note='')=>`<figure class="math-visual"><div class="visual-heading"><span class="visual-dot"></span><b>${esc(title)}</b><small>APOIO VISUAL</small></div><div class="visual-body">${body}</div>${note?`<figcaption>${esc(note)}</figcaption>`:''}</figure>`;
const equation=s=>`<div class="math-expression">${esc(s)}</div>`;
function blocks(n,color='cyan'){
 const units=n<=40?[[1,n]]:[[100,Math.floor(n/100)],[10,Math.floor(n%100/10)],[1,n%10]];
 return `<div class="block-number ${color}"><b>${n}</b>${units.filter(([,c])=>c).map(([value,count])=>`<div class="block-row">${Array.from({length:count},()=>`<span class="unit unit-${value}">${value===1?'':value}</span>`).join('')}</div>`).join('')}${n===0?'<span class="mu">nenhum bloco</span>':''}</div>`;
}
function fractionBar(a,b){return `<div class="fraction-model"><b>${a}/${b}</b><div class="fraction-bar" style="--parts:${b}">${Array.from({length:b},(_,i)=>`<span class="${i<a?'filled':''}"></span>`).join('')}</div></div>`}
function arithmeticVisual(text,ti){
 if(ti<=3){const m=match(text,/Quanto é (\d+) ([+−×÷]) (\d+)/),a=+m[1],b=+m[3],op=m[2];
  if(ti<2)return panel(ti===0?'Junte as quantidades':'Retire a segunda quantidade',`<div class="block-operation">${blocks(a)}<strong>${op}</strong>${blocks(b,'gold')}</div>`,'Cada quadradinho vazio vale 1. Blocos com 10 ou 100 representam agrupamentos dessas quantidades.')+equation(`${a} ${op} ${b} = ?`);

  let row=-1,col=-1;if(ti===2){const m=match(text,/linha (\d+), coluna (\d+)/);row=+m[1]-1;col=+m[2]-1}

  const all=[...text.matchAll(/(-?\d+) ([+−]) (\d+)i/g)].map((m,i)=>[+m[1],+m[3]*(m[2]==='−'?-1:1),ti===1?'z'+(i+1):'z']);
  return panel('Um número complexo no plano',coordinatePlot(all,{complex:true}),ti===1?'Os dois fatores estão marcados. O produto ainda não está desenhado.':ti===2?'O módulo é a distância do ponto à origem.':'O argumento é medido a partir do eixo real positivo, no sentido anti-horário.');
 }
 if(ci===17){

  if(ti===1){const m=match(text,/p\(x\) = (.+) por (.+)\?/);return panel('Divisão de polinômios',flow([m[1],`divisor: ${m[2]}`,'resto = ?']),'O divisor linear pode indicar um valor útil para avaliar o polinômio.');}

  const r=match(text,/x = (-?\d+)/)[1];return panel('Uma raiz faz o resultado zerar',flow([`x = ${r}`,'polinômio com m','resultado = 0']),'Use o valor da raiz para descobrir o coeficiente desconhecido.');

  if(ti===2){const a=+match(text,/x → (\d+)/)[1];p=x=>x+a;domain=[a-3,a+3];options.hole=[a,2*a];caption='O círculo vazio indica que a expressão original não está definida nesse ponto. Observe a aproximação dos dois lados.'}
  if(ti===3){const a=+match(text,/sen\((\d+)x\)/)[1];p=x=>Math.abs(x)<1e-9?a:Math.sin(a*x)/x;domain=[-2,2];options.hole=[0,a];caption='Gráfico de sen(ax)/x próximo de zero, com x em radianos. O ponto em x = 0 é aberto.'}
  if(ti===4){const m=match(text,/de \((\d+)x² \+ (\d+)x\) \/ \((\d+)x² \+ 1\)/);p=x=>(+m[1]*x*x + +m[2]*x)/(+m[3]*x*x+1);domain=[1,40];caption='Observe o comportamento para valores crescentes de x. O valor exato do limite não está marcado.'}
  if(ti===5){const expr=match(text,/f\(x\) = (.+) atinge/)[1],poly=polynomial(expr),center=-poly.coeff[1]/(2*poly.coeff[2]);p=poly.fn;domain=[center-5,center+5];caption='A curva muda de decrescente para crescente no mínimo. Calcule a abscissa exata.'}
  return panel(['Inclinação local','Área com sinal','Aproximação e ponto aberto','Comportamento perto de zero','Para onde a curva se aproxima','O ponto mínimo'][ti],coordinatePlot([],{curve:p,domain,...options}),caption);

function addQuestion(q){
 const card=document.createElement('article');card.className='m bot q question-card';
 const head=document.createElement('div');head.className='question-kicker';head.textContent=`${C[q.ci][0]} / ${C[q.ci][1][q.ti][0]}`;card.append(head);
 {const visual=document.createElement('details');visual.className='question-illustration';visual.open=true;visual.innerHTML='<summary>Representação visual</summary>'+visualMarkup(q);card.append(visual)}
 const prompt=document.createElement('p');prompt.className='question-prompt'+(q.ci===0&&q.ti<=3?' arithmetic-prompt':'');prompt.textContent=q.q;card.append(prompt);
 $('#chat').append(card);$('#chat').scrollTop=Math.max(0,card.offsetTop-$('#chat').offsetTop);
 return card;
}

   the player sees topic names only. Explanations retain the mathematical

const COURSE=[];
const courseRng=seed=>{let state=seed>>>0;const r=(a,b)=>{state=(Math.imul(state,1664525)+1013904223)>>>0;return a+Math.floor(state/4294967296*(b-a+1))};r.pick=a=>a[r(0,a.length-1)];r.sign=()=>r(0,1)?1:-1;return r};
const qNum=(q,a,steps,visual=null)=>({kind:'number',q,answer:String(a),steps,visual});
const qChoice=(q,right,wrong,steps,visual=null)=>({kind:'choice',q,answer:String(right),options:[String(right),...wrong.map(String)].filter((x,i,a)=>a.indexOf(x)===i),steps,visual});
const fracText=(a,b)=>fr(a,b).s;
const money=n=>(Math.round((n+Number.EPSILON)*100)/100).toFixed(2);
const polyText=(a,b,c)=>P([[a,2],[b,1],[c,0]]);
function courseStage(title,summary){COURSE.push({title,summary,lessons:[]})}
function L(id,title,pages,theory,rule,warning,generate){const stage=COURSE.length-1;COURSE[stage].lessons.push({id,title,pages,stage,theory:theory.split('¶'),rule,warning,generate})}
const conceptBank=rows=>(r,k)=>{const v=rows[k%rows.length];return qChoice(v[0],v[1],v[2],v[3])};
const triangleSVG=(base,height,hyp='?',caption='Triângulo retângulo; esquema fora de escala.')=>({kind:'triangle',base,height,hyp,caption});
courseStage('Lógica, conjuntos e funções','Da linguagem matemática às funções e suas transformações.');
L('logic','Proposições e negação','1–3; 12–17','Chama-se proposição ou sentença toda oração declarativa que pode ser classificada em verdadeira ou em falsa. Uma pergunta ou uma ordem não recebe valor lógico dessa maneira.¶A negação de uma proposição verdadeira é falsa, e a negação de uma falsa é verdadeira. Negar “todos têm uma propriedade” significa afirmar que existe pelo menos um que não a tem; não significa que nenhum a tem.','p: V → ¬p: F; p: F → ¬p: V\n¬(∀x, P(x)) ⇔ ∃x, ¬P(x)','Uma sentença aberta, como x + 2 = 5, depende de uma variável; não é uma proposição fechada.',conceptBank([
 ['Qual destas frases é uma proposição?','7 é maior que 3.',['Feche a porta.','Que horas são?','x + 2 = 5.'],['A frase escolhida é declarativa e possui valor lógico determinado: verdadeiro.']],
 ['Qual é a negação de “todos os alunos estudaram”?','Pelo menos um aluno não estudou.',['Nenhum aluno estudou.','Todos os alunos faltaram.','Pelo menos um aluno estudou.'],['Basta um contraexemplo para negar uma afirmação universal.']],
 ['A frase “9 é um número primo” é uma proposição?','Sim, e é falsa.',['Não, porque é falsa.','Sim, e é verdadeira.','É uma pergunta.'],['Proposições podem ser falsas. Como 9 = 3 × 3, a afirmação é falsa.']],
 ['Se p é falsa, qual é o valor de ¬p?','Verdadeiro',['Falso','Indeterminado','Verdadeiro e falso'],['A negação inverte o valor lógico.']],
 ['Qual é a negação de “existe um número do conjunto que é negativo”?','Nenhum número do conjunto é negativo.',['Todos são negativos.','Existe um positivo.','Existe um número que não é negativo.'],['Negar a existência é afirmar que nenhum elemento satisfaz a propriedade.']],
 ['Qual é a negação de x > 4, para x real?','x ≤ 4',['x < 4','x ≥ 4','x = 4'],['A negação inclui a igualdade: tudo que não é maior que 4 é menor ou igual a 4.']]
]));
L('connectives','Conectivos e condicionais','3–12','A conjunção p ∧ q é verdadeira apenas quando as duas proposições são verdadeiras. A disjunção inclusiva p ∨ q é falsa apenas quando ambas são falsas.¶A condicional p → q só é falsa no caso em que p é verdadeira e q é falsa. A bicondicional p ↔ q é verdadeira quando p e q têm o mesmo valor lógico. Uma tabela-verdade permite verificar todas as possibilidades.','¬(p ∧ q) ⇔ ¬p ∨ ¬q\np → q ⇔ ¬p ∨ q','O “ou” da lógica é inclusivo, salvo indicação explícita de exclusão.',(r,k)=>{const p=!!r(0,1),q=!!r(0,1),ops=['∧','∨','→','↔'],op=ops[k%4],v=[p&&q,p||q,!p||q,p===q][k%4];return qChoice(`Se p é ${p?'V':'F'} e q é ${q?'V':'F'}, qual é o valor de p ${op} q?`,v?'V':'F',[v?'F':'V'],[`Use a regra de ${['conjunção','disjunção','condicional','bicondicional'][k%4]}.`,`Substituindo os valores dados, p ${op} q é ${v?'verdadeira':'falsa'}.`])});
L('sets','Conjuntos, pertinência e inclusão','18–27','Conjunto, elemento e pertinência são noções primitivas. Usamos x ∈ A para indicar que x é elemento de A; A ⊆ B significa que todo elemento de A também pertence a B.¶O conjunto vazio não tem elementos e é subconjunto de qualquer conjunto. Um conjunto com n elementos possui 2ⁿ subconjuntos, pois cada elemento pode entrar ou não no subconjunto que estamos formando.','x ∈ A: elemento em conjunto\nA ⊆ B: inclusão entre conjuntos\nNúmero de subconjuntos: 2ⁿ','Não confunda o elemento a com o conjunto unitário {a}.',(r,k)=>{const n=r(2,9);return qNum(`Um conjunto possui ${n} elementos distintos. Quantos subconjuntos ele possui?`,2**n,[`Cada um dos ${n} elementos tem duas possibilidades: entrar ou não entrar.`,`São 2^${n} = ${2**n} subconjuntos, incluindo o vazio e o próprio conjunto.`],{kind:'chips',items:Array.from({length:n},(_,i)=>String.fromCharCode(65+i))})});
L('set-operations','União, interseção e diferença','28–37','A união A ∪ B reúne os elementos que pertencem a A ou a B. A interseção A ∩ B reúne os que pertencem simultaneamente aos dois conjuntos. A diferença A − B contém os elementos de A que não pertencem a B.¶Ao somar n(A) e n(B), contamos os elementos comuns duas vezes. Subtrair n(A ∩ B) corrige essa duplicação.','n(A ∪ B) = n(A) + n(B) − n(A ∩ B)','A diferença A − B geralmente não coincide com B − A.',(r,k)=>{const c=r(2,10),a=c+r(2,15),b=c+r(2,15);return qNum(`Em dois conjuntos, n(A) = ${a}, n(B) = ${b} e n(A ∩ B) = ${c}. Determine n(A ∪ B).`,a+b-c,[`Os ${c} elementos comuns foram contados duas vezes.`,`n(A ∪ B) = ${a} + ${b} − ${c} = ${a+b-c}.`],{kind:'venn',a,b,c})});
L('number-sets','Conjuntos numéricos e intervalos','40–56','Os naturais são 0, 1, 2, 3, …; os inteiros acrescentam os negativos. Um racional pode ser escrito como a/b, com a e b inteiros e b ≠ 0. Os reais incluem racionais e irracionais.¶Intervalos representam subconjuntos dos reais. Colchete inclui o extremo; parêntese o exclui. Para contar inteiros de a até b com ambos incluídos, contamos b − a + 1 valores.','ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ\n[a,b] inclui a e b; (a,b) exclui os dois','Nem todo ponto de um intervalo é inteiro. A contagem pedida precisa restringir o conjunto.',(r,k)=>{const a=r(-8,2),b=a+r(5,15),l=k%2,h=(k>>1)%2;return qNum(`Quantos inteiros pertencem a ${l?'(':'['}${a}, ${b}${h?')':']'}?`,b-a+1-l-h,[`Com os dois extremos incluídos: ${b} − (${a}) + 1 = ${b-a+1}.`,`Exclua ${l+h} extremo(s): resultado ${b-a+1-l-h}.`],{kind:'interval',a,b,left:!l,right:!h})});
L('relations','Pares ordenados e relações','64–78','Num par ordenado (a,b), a posição dos elementos importa. O produto cartesiano A × B contém todos os pares em que a primeira componente pertence a A e a segunda, a B.¶Uma relação de A em B é um subconjunto de A × B. Seu domínio reúne as primeiras componentes dos pares; sua imagem reúne as segundas. Elementos repetidos são contados uma única vez nesses conjuntos.','n(A × B) = n(A) · n(B)','Em geral, (a,b) é diferente de (b,a).',(r,k)=>{const a=r(2,6),b=r(2,7);return qNum(`A tem ${a} elementos e B tem ${b}. Quantos pares ordenados há em A × B?`,a*b,[`Para cada um dos ${a} elementos de A existem ${b} escolhas em B.`,`${a} × ${b} = ${a*b} pares.`],{kind:'flow',items:[`${a} escolhas em A`,`${b} escolhas em B`,'pares ordenados']})});
L('functions','Definição, domínio e imagem','79–94','Uma função de A em B associa a cada elemento de A um único elemento de B. Todo elemento do domínio precisa ter imagem, e não pode ter duas imagens diferentes.¶Na notação y = f(x), x é a entrada e f(x), a saída. O domínio precisa respeitar as condições da expressão: denominadores não podem ser zero; radicandos de raízes de índice par precisam ser não negativos quando trabalhamos nos reais.','f: A → B; x ↦ f(x)','Contradomínio é o conjunto B; imagem é o conjunto dos valores efetivamente atingidos.',(r,k)=>{const a=r(2,5),b=r(-8,8),x=r(-4,6);return qNum(`Se f(x) = ${P([[a,1],[b,0]])}, calcule f(${x}).`,a*x+b,[`Substitua x por ${x}: f(${x}) = ${a} · (${x}) + (${b}).`,`Efetue a multiplicação e depois a soma: ${a*x+b}.`],{kind:'flow',items:[`x = ${x}`,P([[a,1],[b,0]]),'f(x) = ?']})});
L('affine','Função afim e seu zero','97–120','A função afim não constante associa a cada x o número ax + b, com a ≠ 0. Seu gráfico é uma reta. O coeficiente a mede a variação de y quando x aumenta uma unidade; b é a ordenada do encontro com o eixo vertical.¶Para encontrar o zero, resolvemos ax + b = 0. Se a > 0, a função é crescente; se a < 0, é decrescente. Esses fatos também permitem estudar o sinal de f(x).','f(x) = ax + b; zero: x = −b/a','O zero da função é uma abscissa; não o confunda com o coeficiente b.',(r,k)=>{const a=r(1,7)*r.sign(),root=r(-7,7),b=-a*root;return qNum(`Qual é o zero de f(x) = ${P([[a,1],[b,0]])}?`,root,[`Faça f(x) = 0: ${P([[a,1],[b,0]])} = 0.`,`Então x = −(${b})/(${a}) = ${root}.`],{kind:'polynomial',coeff:[b,a],domain:[root-4,root+4]})});
L('inequalities','Inequações e estudo do sinal','121–136','Uma inequação compara expressões por >, <, ≥ ou ≤. A solução é o conjunto dos valores que tornam a desigualdade verdadeira dentro do domínio de validade.¶Somar a mesma quantidade aos dois membros preserva a desigualdade. Multiplicar ou dividir por um número negativo inverte seu sentido. Em produtos e quocientes, estudamos os sinais dos fatores e excluímos os zeros do denominador.','a < b e c < 0 ⇒ ac > bc','Na divisão por um número negativo, o sentido da desigualdade muda.',(r,k)=>{const a=r(1,6)*(k%2?-1:1),x=r(-6,6),b=r(-7,7),c=a*x+b,correct=`x ${a>0?'>':'<'} ${x}`;return qChoice(`Resolva ${P([[a,1],[b,0]])} > ${c}.`,correct,[`x ${a>0?'<':'>'} ${x}`,`x = ${x}`,`x ≥ ${x}`],[`Subtraia ${b}: ${a}x > ${a*x}.`,`Divida por ${a}${a<0?', invertendo o sinal':''}: ${correct}.`])});
L('quadratic','Função quadrática: raízes e vértice','137–181','Uma função quadrática tem a forma f(x) = ax² + bx + c, com a ≠ 0. Seu gráfico é uma parábola: a > 0 dá concavidade para cima e a < 0, para baixo.¶O discriminante Δ = b² − 4ac indica o número de zeros reais. O vértice tem abscissa −b/(2a), e sua ordenada é obtida substituindo esse x na função. Ele representa o mínimo se a > 0 e o máximo se a < 0.','x = (−b ± √Δ)/(2a)\nxᵥ = −b/(2a); yᵥ = f(xᵥ)','A fórmula do vértice tem denominador 2a, inclusive quando a é negativo.',(r,k)=>{const a=r(1,4)*r.sign(),v=r(-5,5),c=r(-8,8),b=-2*a*v,ask=k%2;return qNum(`Para f(x) = ${polyText(a,b,c)}, determine ${ask?'a ordenada':'a abscissa'} do vértice.`,ask?c-a*v*v:v,[`xᵥ = −(${b})/(2 · ${a}) = ${v}.`,`yᵥ = f(${v}) = ${c-a*v*v}.`,`A coordenada pedida é ${ask?c-a*v*v:v}.`],{kind:'polynomial',coeff:[c,b,a],domain:[v-4,v+4]})});
L('modulus','Módulo e equações modulares','184–202','Sendo x real, define-se módulo ou valor absoluto de x por |x| = x se x ≥ 0 e |x| = −x se x < 0. Assim, o módulo nunca é negativo.¶Geometricamente, |x − a| é a distância entre x e a. A equação |x − a| = r, com r > 0, tem duas soluções: a − r e a + r. Para r = 0 existe uma; para r < 0 não existe solução real.','|x − a| = r ⇒ x = a − r ou x = a + r (r ≥ 0)','√(x²) = |x|, e não necessariamente x.',(r,k)=>{const a=r(-8,8),b=r(1,8);return qNum(`Qual é a maior solução real de |x − (${a})| = ${b}?`,a+b,[`A distância de x a ${a} deve ser ${b}.`,`As soluções são ${a} − ${b} = ${a-b} e ${a} + ${b} = ${a+b}.`,`A maior é ${a+b}.`],{kind:'flow',items:[`Centro: ${a}`,`Distância: ${b}`,'x = ?']})});
L('elementary','Outras funções elementares','205–211','A função cúbica x³ preserva o sinal de x e é crescente em todo o conjunto dos reais. A função recíproca 1/x não é definida em zero.¶A função maior inteiro ⌊x⌋ fornece o maior inteiro que não ultrapassa x. Para números negativos, isso não equivale a simplesmente apagar a parte decimal: ⌊−2,3⌋ = −3.','⌊x⌋ = n ⇔ n ≤ x < n + 1','Na função maior inteiro, caminhe para o inteiro à esquerda na reta numérica.',(r,k)=>{const a=r(-8,8),b=r(1,9),x=a+b/10;return qNum(`Calcule ⌊${x.toFixed(1).replace('.',',')}⌋, o maior inteiro que não ultrapassa esse número.`,a,[`${a} ≤ ${x.toFixed(1)} < ${a+1}.`,`Logo, o maior inteiro que não ultrapassa o número é ${a}.`])});
L('composition','Composição e função inversa','212–246','Na composição g ∘ f, primeiro aplicamos f à entrada e depois aplicamos g ao resultado. Portanto, (g ∘ f)(x) = g(f(x)). Em geral, trocar a ordem muda o resultado.¶Uma função bijetora possui inversa: cada saída corresponde a uma única entrada. Para encontrar uma expressão inversa, isolamos a variável original na equação y = f(x), respeitando os domínios.','(g ∘ f)(x) = g(f(x))\nf⁻¹(f(x)) = x','f⁻¹ não significa 1/f.',(r,k)=>{const a=r(2,5),b=r(-6,6),c=r(1,4),e=r(-4,4),x=r(-3,5);if(k%2)return qNum(`Se f(x) = ${P([[a,1],[b,0]])}, calcule f⁻¹(${a*x+b}).`,x,[`Resolva ${a}x + (${b}) = ${a*x+b}.`,`x = (${a*x+b} − (${b}))/${a} = ${x}.`]);return qNum(`Se f(x) = ${P([[a,1],[b,0]])} e g(x) = ${P([[c,1],[e,0]])}, calcule g(f(${x})).`,c*(a*x+b)+e,[`Primeiro, f(${x}) = ${a*x+b}.`,`Depois, g(${a*x+b}) = ${c} · (${a*x+b}) + (${e}) = ${c*(a*x+b)+e}.`])});
L('radical-equations','Equações e inequações irracionais','249–269','Equação irracional é uma equação em que há incógnita sob um ou mais radicais. Para eliminá-los, elevamos os dois membros a potências convenientes, depois de observar as condições de existência.¶Elevar ao quadrado pode introduzir raízes estranhas. Por isso, os candidatos precisam ser verificados na equação original. Em √f(x) = g(x), exigimos g(x) ≥ 0 e f(x) = g(x)².','√f(x) = g(x) ⇔ f(x) = g(x)² e g(x) ≥ 0','Não aceite uma solução apenas porque satisfaz a equação depois de elevar ao quadrado.',(r,k)=>{const a=r(1,9),b=r(2,9),x=b*b+a;return qNum(`Resolva √(x − ${a}) = ${b}.`,x,[`O radicando exige x ≥ ${a}; o lado direito é não negativo.`,`Elevando ao quadrado: x − ${a} = ${b*b}, então x = ${x}.`,`Verificação: √(${x} − ${a}) = √${b*b} = ${b}.`])});
courseStage('Potências, exponenciais e logaritmos','Expoentes, crescimento e a operação inversa da potenciação.');
L('powers','Potências e raízes','1–23','Uma potência de expoente natural é um produto de fatores iguais. Para a ≠ 0, definimos a⁰ = 1 e a⁻ⁿ = 1/aⁿ. A raiz enésima aritmética de um número não negativo é o número não negativo cuja potência de ordem n reproduz o radicando.¶Para bases positivas, expoentes racionais se relacionam com raízes: a^(m/n) = ⁿ√(aᵐ). As propriedades das potências permitem simplificar produtos e quocientes de mesma base.','aᵐ · aⁿ = aᵐ⁺ⁿ\naᵐ/aⁿ = aᵐ⁻ⁿ; (aᵐ)ⁿ = aᵐⁿ','Expoente negativo significa inverso, não número negativo.',(r,k)=>{const a=r(2,5),n=r(1,4);if(k%2)return qNum(`Escreva ${a}^(−${n}) como fração.`,`1/${a**n}`,[`Use a⁻ⁿ = 1/aⁿ.`,`${a}^(−${n}) = 1/${a}^${n} = 1/${a**n}.`]);return qNum(`Calcule a raiz cúbica de ${a**3}.`,a,[`Procuramos b tal que b³ = ${a**3}.`,`Como ${a}³ = ${a**3}, a raiz é ${a}.`])});
L('exponential','Função exponencial','27–38','Dado a > 0 e a ≠ 1, a função exponencial de base a associa x a aˣ. Seus valores são positivos, seu domínio é ℝ e sua imagem é o conjunto dos reais positivos.¶Toda curva exponencial passa por (0,1). Se a > 1, ela é crescente; se 0 < a < 1, é decrescente. Essas propriedades permitem comparar potências e resolver equações.','f(x) = aˣ; a > 0, a ≠ 1\nf(0) = 1','A base deve ser positiva; uma base igual a 1 produz uma função constante.',(r,k)=>{const a=r(2,5),x=r(1,5);return qNum(`Se f(x) = ${a}^x, calcule f(${x}).`,a**x,[`Substitua x por ${x}.`,`f(${x}) = ${a}^${x} = ${a**x}.`],{kind:'flow',items:[`x = ${x}`,`base ${a}`,'potência']})});
L('exp-equations','Equações exponenciais','39–54; 88–90','Numa equação exponencial, a incógnita aparece no expoente. Quando conseguimos escrever os dois membros com a mesma base positiva diferente de 1, igualamos os expoentes.¶Em expressões com aˣ e a²ˣ, a substituição t = aˣ transforma a equação em uma equação algébrica. Depois de resolvê-la, lembre que t precisa ser positivo.','aᵘ = aᵛ ⇔ u = v, para a > 0 e a ≠ 1','Se a substituição é t = aˣ, descarte valores de t que não sejam positivos.',(r,k)=>{const a=r(2,4),c=r(1,4),x=r(1,4),n=x+c;return qNum(`Resolva ${a}^(x + ${c}) = ${a**n}.`,x,[`${a**n} = ${a}^${n}.`,`Como as bases são iguais, x + ${c} = ${n}.`,`Logo, x = ${x}.`])});
L('log-definition','Definição de logaritmo','57–62','O logaritmo de b na base a é o expoente x ao qual devemos elevar a para obter b. Exigimos a > 0, a ≠ 1 e b > 0.¶A definição liga diretamente duas escritas da mesma igualdade: logₐ b = x e aˣ = b. Por isso, logₐ 1 = 0, logₐ a = 1 e logₐ(aˣ) = x.','logₐ b = x ⇔ aˣ = b','O logaritmando precisa ser estritamente positivo, não apenas não negativo.',(r,k)=>{const a=r(2,5),x=r(-3,4),value=x<0?`1/${a**-x}`:a**x;return qNum(`Calcule log na base ${a} de (${value}).`,x,[`Procure x em ${a}^x = ${value}.`,`${value} = ${a}^(${x}), portanto o logaritmo vale ${x}.`])});
L('log-properties','Propriedades e mudança de base','63–76','O logaritmo de um produto é a soma dos logaritmos; o de um quociente é a diferença. O logaritmo de uma potência permite trazer o expoente para a frente como fator. Essas regras decorrem das propriedades das potências.¶A mudança de base permite calcular logₐ b por logc b/logc a. Todos os logaritmos envolvidos precisam existir, e a base escolhida deve ser positiva e diferente de 1.','logₐ(uv) = logₐu + logₐv\nlogₐ(u/v) = logₐu − logₐv\nlogₐ(uᵏ) = k logₐu','Não existe uma regra de separar log(u + v) em log u + log v.',(r,k)=>{const a=r(2,4),m=r(1,4),n=r(1,4);return qNum(`Calcule log${sb(a)} ${a**m} + log${sb(a)} ${a**n}.`,m+n,[`log${sb(a)} ${a**m} = ${m} e log${sb(a)} ${a**n} = ${n}.`,`A soma é ${m} + ${n} = ${m+n}.`])});
L('log-function','Função logarítmica','80–87','A função f(x) = logₐ x tem domínio x > 0 e imagem ℝ. Ela é a inversa da função exponencial de mesma base, por isso seus gráficos são simétricos em relação à reta y = x.¶Se a > 1, a função é crescente; se 0 < a < 1, é decrescente. Em qualquer base admissível, o gráfico passa por (1,0).','Domínio: (0,+∞); imagem: ℝ\nlogₐ 1 = 0','O número zero não pertence ao domínio de uma função logarítmica.',(r,k)=>{const shift=r(-8,8);return qChoice(`Qual é o domínio real de f(x) = log₂(x − (${shift}))?`,`x > ${shift}`,[`x ≥ ${shift}`,`x < ${shift}`,'Todos os reais'],[`O argumento do logaritmo deve ser positivo: x − (${shift}) > 0.`,`Portanto, x > ${shift}.`])});
L('log-equations','Equações logarítmicas','91–108','Antes de resolver uma equação logarítmica, estabeleça as condições de existência: argumentos positivos e bases admissíveis. Em seguida, use a definição ou as propriedades para reduzir a equação.¶Se dois logaritmos têm a mesma base, igualamos os argumentos. Ao final, conferimos se os valores encontrados respeitam o domínio inicial.','logₐ f(x) = logₐ g(x) ⇒ f(x) = g(x), com argumentos positivos','As condições de existência fazem parte da solução.',(r,k)=>{const a=r(2,5),n=r(1,4),b=r(1,8),x=a**n+b;return qNum(`Resolva log${sb(a)}(x − ${b}) = ${n}.`,x,[`Exigimos x > ${b}.`,`Pela definição, x − ${b} = ${a}^${n} = ${a**n}.`,`x = ${x}, que satisfaz a condição.`])});
L('exp-log-inequalities','Inequações exponenciais e logarítmicas','112–125','A monotonicidade decide o sentido da comparação. Para base maior que 1, comparar potências ou logaritmos preserva o sentido; para base entre 0 e 1, ele se inverte.¶Nas inequações logarítmicas, o conjunto encontrado deve ser intersectado com o domínio. A restrição de positividade dos argumentos continua valendo mesmo depois de eliminar os logaritmos.','a > 1: aᵘ > aᵛ ⇔ u > v\n0 < a < 1: aᵘ > aᵛ ⇔ u < v','Não esqueça de inverter o sentido para bases entre 0 e 1.',(r,k)=>{const n=r(1,6),small=k%2;return qChoice(`Resolva ${small?'(1/2)':'2'}^x > ${small?'(1/2)':'2'}^${n}.`,`x ${small?'<':'>'} ${n}`,[`x ${small?'>':'<'} ${n}`,`x = ${n}`,`x ≥ ${n+1}`],[`A base ${small?'está entre 0 e 1: a função é decrescente':'é maior que 1: a função é crescente'}.`,`Logo, ${small?'invertemos':'preservamos'} o sentido: x ${small?'<':'>'} ${n}.`])});
L('decimal-logs','Logaritmos decimais','130–141','O logaritmo decimal usa base 10. Escrever um número como m · 10ᵏ, com 1 ≤ m < 10, separa seu logaritmo em k + log₁₀m.¶A característica é a parte inteira do logaritmo, e a mantissa está entre 0 e 1. Para números menores que 1, a característica é negativa. Estimar o intervalo entre potências de 10 ajuda a interpretar o resultado.','10ᵏ ≤ N < 10ᵏ⁺¹ ⇒ k ≤ log₁₀N < k + 1','Em números menores que 1, “parte inteira” segue a ideia de piso, não de truncamento.',(r,k)=>{const e=r(-3,5),m=r(2,9),v=m*10**e;return qNum(`Qual é a característica de log₁₀(${v.toFixed(Math.max(0,-e))})?`,e,[`O número está entre 10^${e} e 10^${e+1}.`,`Logo, seu logaritmo está entre ${e} e ${e+1}, e a característica é ${e}.`])});
courseStage('Trigonometria','Do triângulo retângulo ao ciclo, às equações e aos triângulos quaisquer.');
L('trig-geometry','Ângulos e triângulos retângulos','2–11','Um ângulo é formado por duas semirretas de mesma origem. Um ângulo reto mede 90°, e a soma dos ângulos internos de um triângulo é 180°.¶No triângulo retângulo, o lado oposto ao ângulo reto é a hipotenusa; os outros são os catetos. O quadrado da hipotenusa é igual à soma dos quadrados dos catetos.','a² = b² + c²','A hipotenusa é sempre o maior lado e fica oposta ao ângulo reto.',(r,k)=>{const t=r.pick([[3,4,5],[5,12,13],[8,15,17]]),m=r(1,4),[a,b,c]=t.map(v=>v*m);return qNum(`Um triângulo retângulo tem catetos ${a} e ${b}. Determine a hipotenusa.`,c,[`h² = ${a}² + ${b}² = ${a*a+b*b}.`,`Como uma medida é positiva, h = √${c*c} = ${c}.`],triangleSVG(a,b))});
L('trig-ratios','Seno, cosseno e tangente','11–22','Triângulos retângulos com o mesmo ângulo agudo são semelhantes. Por isso, as razões entre seus lados correspondentes dependem do ângulo, não do tamanho do triângulo.¶O seno é a razão entre cateto oposto e hipotenusa; o cosseno, entre cateto adjacente e hipotenusa; a tangente, entre cateto oposto e cateto adjacente. Identifique primeiro o ângulo de referência.','sen θ = oposto/hipotenusa\ncos θ = adjacente/hipotenusa\ntg θ = oposto/adjacente','O mesmo cateto pode ser oposto a um ângulo e adjacente ao outro.',(r,k)=>{const[a,b,c]=r.pick([[3,4,5],[5,12,13],[8,15,17]]),mode=k%3,an=[fracText(a,c),fracText(b,c),fracText(a,b)][mode];return qNum(`Em um triângulo retângulo, em relação a θ, o cateto oposto mede ${a}, o adjacente ${b} e a hipotenusa ${c}. Calcule ${['sen','cos','tg'][mode]} θ.`,an,[`Use ${['oposto/hipotenusa','adjacente/hipotenusa','oposto/adjacente'][mode]}.`,`A razão é ${[a,b,a][mode]}/${[c,c,b][mode]} = ${an}.`],triangleSVG(b,a,c))});
L('arcs','Arcos, graus e radianos','24–35','Um radiano é a medida de um ângulo central que determina um arco de comprimento igual ao raio. Uma volta completa mede 360° ou 2π radianos.¶A medida em radianos é a razão entre o comprimento do arco e o raio. Para converter graus em radianos, multiplicamos por π/180; para converter no sentido inverso, multiplicamos por 180/π.','360° = 2π rad\ncomprimento do arco: ℓ = rθ, com θ em radianos','Na fórmula ℓ = rθ, θ precisa estar em radianos.',(r,k)=>{const d=r.pick([30,45,60,90,120,135,150,180,270]),f=fracText(d,180);return qNum(`Um ângulo mede ${d}°. Se sua medida em radianos é cπ, determine c.`,f,[`Multiplique por π/180: ${d}° = (${d}/180)π rad.`,`Simplificando, c = ${f}.`],{kind:'angle',degrees:d})});
L('unit-circle','Razões no ciclo trigonométrico','39–60','O ciclo trigonométrico é uma circunferência orientada de raio 1, centrada na origem. O sentido anti-horário é positivo. A cada arco associamos um ponto P: sua abscissa é o cosseno e sua ordenada, o seno.¶Seno e cosseno podem ser negativos, conforme o quadrante. A tangente é sen θ/cos θ quando cos θ ≠ 0; portanto, não existe nos arcos em que o cosseno se anula.','P = (cos θ, sen θ)\ntg θ = sen θ/cos θ','No segundo quadrante, o seno é positivo e o cosseno é negativo.',(r,k)=>{const q=r(1,4),type=k%2?'seno':'cosseno',positive=type==='seno'?q<=2:q===1||q===4;return qChoice(`Qual é o sinal do ${type} de um ângulo no interior do ${q}º quadrante?`,positive?'Positivo':'Negativo',[positive?'Negativo':'Positivo','Sempre zero'],[`O ${type} corresponde à ${type==='seno'?'ordenada y':'abscissa x'} do ponto no ciclo.`,`No ${q}º quadrante, essa coordenada é ${positive?'positiva':'negativa'}.`],{kind:'angle',degrees:[45,135,225,315][q-1]})});
L('trig-identity','Relações fundamentais','61–71','No círculo de raio 1, o teorema de Pitágoras aplicado às coordenadas do ponto fornece sen²θ + cos²θ = 1. Dividindo essa identidade por cos²θ ou por sen²θ, obtemos outras relações.¶Conhecer uma razão permite calcular outra, mas a identidade quadrática não decide sozinha o sinal. O quadrante do ângulo é necessário para escolher a raiz correta.','sen²θ + cos²θ = 1\n1 + tg²θ = sec²θ','Ao tirar uma raiz, determine o sinal pelo quadrante.',(r,k)=>{const[a,b,c]=r.pick([[3,4,5],[5,12,13],[8,15,17]]),second=k%2,answer=fracText(second?-b:b,c);return qNum(`Se sen θ = ${a}/${c} e θ está no ${second?'2º':'1º'} quadrante, calcule cos θ.`,answer,[`cos²θ = 1 − (${a}/${c})² = ${b*b}/${c*c}.`,`No ${second?'2º':'1º'} quadrante, o cosseno é ${second?'negativo':'positivo'}.`,`cos θ = ${answer}.`])});
L('reference-angles','Arcos notáveis e redução','72–84','Os valores dos ângulos de 30°, 45° e 60° podem ser obtidos em triângulos especiais. Para outros quadrantes, usamos um ângulo de referência no primeiro quadrante.¶A redução preserva o módulo da razão apropriada, mas o sinal depende do quadrante. Ângulos que diferem por uma volta completa têm os mesmos seno e cosseno.','sen 30° = 1/2; cos 60° = 1/2\nsen 45° = cos 45° = √2/2\nsen 60° = cos 30° = √3/2','Reduzir ao primeiro quadrante não significa manter automaticamente o sinal.',(r,k)=>{const data=[['sen',30,'1/2'],['sen',150,'1/2'],['sen',210,'-1/2'],['sen',330,'-1/2'],['cos',120,'-1/2'],['cos',240,'-1/2'],['cos',300,'1/2']][(k+r(0,6))%7];return qNum(`Calcule ${data[0]} ${data[1]}°.`,data[2],[`Localize ${data[1]}° no ciclo e reduza ao ângulo de referência.`,`Use o valor notável e o sinal do quadrante: ${data[2]}.`],{kind:'angle',degrees:data[1]})});
L('periodic-functions','Funções circulares e periodicidade','86–118','Uma função periódica repete seus valores quando o argumento aumenta de um período. Seno e cosseno têm período fundamental 2π, enquanto a tangente tem período π.¶Em f(x) = A sen(bx + c) + d, com A e b não nulos, o módulo de A é a amplitude e 2π/|b| é o período. O termo d desloca o gráfico verticalmente.','Tsen = Tcos = 2π/|b|\nTtg = π/|b|','A amplitude é não negativa: use |A|.',(r,k)=>{const a=r(1,6)*r.sign(),b=r(1,6),d=r(-3,3);return k%2?qNum(`Qual é a amplitude de f(x) = ${a} sen(${b}x) + (${d})?`,Math.abs(a),[`A amplitude é |A|.`,`|${a}| = ${Math.abs(a)}.`]):qNum(`O período de f(x) = sen(${b}x) é cπ. Determine c.`,fracText(2,b),[`T = 2π/|${b}|.`,`Logo, c = ${fracText(2,b)}.`])});
L('trig-transform','Adição e duplicação de arcos','119–144','As fórmulas de adição exprimem as razões de uma soma de ângulos em função das razões dos ângulos separados. Não é correto distribuir seno ou cosseno sobre uma soma como se fossem funções lineares.¶Tomando os dois ângulos iguais, obtemos as fórmulas de duplicação. Por exemplo, sen(2x) = 2 sen x cos x e cos(2x) = cos²x − sen²x.','sen(a+b) = sen a cos b + cos a sen b\ncos(a+b) = cos a cos b − sen a sen b','Em geral, sen(a+b) ≠ sen a + sen b.',(r,k)=>{const[a,b,c]=r.pick([[3,4,5],[5,12,13],[8,15,17]]),ask=k%2;return qNum(`Se sen x = ${a}/${c} e cos x = ${b}/${c}, calcule ${ask?'cos':'sen'}(2x).`,ask?fracText(b*b-a*a,c*c):fracText(2*a*b,c*c),ask?[`cos(2x) = cos²x − sen²x.`,`(${b}/${c})² − (${a}/${c})² = ${fracText(b*b-a*a,c*c)}.`]:['sen(2x) = 2 sen x cos x.',`2 · (${a}/${c}) · (${b}/${c}) = ${fracText(2*a*b,c*c)}.`])});
L('trig-identities','Identidades trigonométricas','147–158','Uma identidade é uma igualdade válida para todos os valores do domínio comum das expressões. Para demonstrá-la, transformamos um dos membros por relações já conhecidas até obter o outro.¶Escrever tangente, cotangente, secante e cossecante por seno e cosseno costuma simplificar o trabalho. Não se pode dividir por uma expressão que possa ser zero sem registrar a restrição.','sec x = 1/cos x; cossec x = 1/sen x\ncos²x = 1 − sen²x','Uma identidade precisa valer em todo o domínio indicado, não apenas em um exemplo.',(r,k)=>{const n=r(2,7);return qNum(`Para sen x ≠ 0, calcule (1 − cos²x)/sen²x + ${n}.`,n+1,['Pela relação fundamental, 1 − cos²x = sen²x.','A fração vale 1 no domínio dado.',`Resultado: 1 + ${n} = ${n+1}.`])});
L('trig-equations','Equações trigonométricas','159–181','Resolver uma equação trigonométrica é encontrar todos os arcos que satisfazem a igualdade, respeitando o intervalo pedido. No ciclo, um mesmo seno costuma corresponder a dois pontos por volta.¶Para sen x = sen α, as soluções gerais são x = α + 2kπ ou x = π − α + 2kπ. Para cos x = cos α, temos x = ±α + 2kπ; para tangente, o período é π.','sen x = sen α ⇒ x = α + 2kπ ou π − α + 2kπ','Não dê apenas o ângulo de referência quando o problema pede todas as soluções.',(r,k)=>{const a=r.pick([15,30,45,60,75]),sol=`{${a}°, ${180-a}°}`;return qChoice(`Em [0°,360°), qual é o conjunto solução de sen x = sen ${a}°?`,sol,[`{${a}°}`,`{${a}°, ${360-a}°}`,`{${a+180}°, ${360-a}°}`],[`No primeiro quadrante, x = ${a}°.`,`O outro ponto de mesmo seno está em 180° − ${a}° = ${180-a}°.`,`Os dois pertencem ao intervalo pedido.`])});
L('trig-inequalities','Inequações no ciclo','182–193','Para resolver uma inequação trigonométrica, localizamos no ciclo os pontos que satisfazem a comparação e lemos os intervalos de arcos correspondentes.¶Seno positivo corresponde à metade superior; cosseno positivo, à metade direita. Nos extremos em que a razão é igual ao valor comparado, incluímos ou excluímos o ponto conforme a desigualdade seja não estrita ou estrita.','Em [0°,360°): sen x > 0 ⇔ 0° < x < 180°','Uma desigualdade estrita não inclui os pontos de igualdade.',conceptBank([
 ['Em [0°,360°), onde sen x > 0?','(0°,180°)',['[0°,180°]','(180°,360°)','(90°,270°)'],['O seno é a coordenada vertical: é positivo na metade superior, sem os extremos.']],
 ['Em [0°,360°), onde sen x < 0?','(180°,360°)',['(0°,180°)','[180°,360°)','(90°,270°)'],['A metade inferior tem ordenada negativa; 180° e 360° não satisfazem a desigualdade.']],
 ['Em [0°,360°), onde cos x < 0?','(90°,270°)',['(0°,180°)','[90°,270°]','(270°,360°)'],['Cosseno é a abscissa, negativa na metade esquerda.']],
 ['Em [0°,180°], onde sen x ≥ 0?','[0°,180°]',['(0°,180°)','{90°}','Conjunto vazio'],['O seno é não negativo em toda a metade superior, incluindo seus extremos.']],
 ['Em [0°,180°], onde cos x > 0?','[0°,90°)',['(0°,90°)','[90°,180°]','[0°,90°]'],['Em zero o cosseno vale 1; em 90° vale zero e é excluído.']],
 ['Em [0°,360°), onde sen x ≥ 1?','{90°}',['(0°,180°)','{0°,180°}','Conjunto vazio'],['O seno nunca excede 1 e atinge 1 somente em 90° nesse intervalo.']]
]));
L('inverse-trig','Funções circulares inversas','197–212','Para inverter uma função trigonométrica, restringimos seu domínio a um intervalo em que ela seja bijetora sobre sua imagem. O arco-seno devolve um valor em [−90°,90°]; o arco-cosseno, em [0°,180°].¶O arco-tangente devolve um valor em (−90°,90°). Essas são escolhas de ramo principal: o resultado da função inversa é único, embora uma equação trigonométrica possa ter infinitas soluções.','arcsen: [−1,1] → [−90°,90°]\narccos: [−1,1] → [0°,180°]','arcsen(sen x) não é sempre igual a x fora do intervalo principal.',(r,k)=>{const d=r.pick([['arcsen','1/2',30],['arcsen','-1/2',-30],['arccos','1/2',60],['arccos','-1/2',120],['arctg','1',45],['arctg','-1',-45]]);return qNum(`Calcule ${d[0]}(${d[1]}) em graus, no ramo principal.`,d[2],[`Procure o ângulo do intervalo principal cuja razão seja ${d[1]}.`,`Esse ângulo é ${d[2]}°.`])});
L('triangle-laws','Triângulos quaisquer: leis dos senos e cossenos','226–246','A lei dos cossenos generaliza Pitágoras para um triângulo qualquer: relaciona um lado aos outros dois e ao ângulo entre eles. Quando o ângulo é reto, o termo com cosseno desaparece.¶A lei dos senos relaciona cada lado ao seno do ângulo oposto. A razão comum é 2R, sendo R o raio da circunferência circunscrita. Escolha a lei conforme os dados conhecidos.','a² = b² + c² − 2bc cos A\na/sen A = b/sen B = c/sen C = 2R','O ângulo usado na lei dos cossenos fica entre os dois lados conhecidos.',(r,k)=>{const b=r(2,10),c=r(2,10),ans=b*b+c*c-b*c;return qNum(`Dois lados de um triângulo medem ${b} e ${c}, e o ângulo entre eles mede 60°. Qual é o quadrado do terceiro lado?`,ans,[`a² = ${b}² + ${c}² − 2 · ${b} · ${c} · cos 60°.`,`Como cos 60° = 1/2, a² = ${b*b} + ${c*c} − ${b*c} = ${ans}.`])});
courseStage('Sequências, matrizes e sistemas','Regularidades numéricas, organização em tabelas e equações simultâneas.');
L('sequences','Sequências e lei de formação','1–5','Chama-se sequência infinita toda aplicação dos naturais positivos nos reais. O número associado ao índice n é o termo aₙ. Uma sequência finita utiliza apenas os índices de 1 até uma quantidade determinada.¶Uma lei explícita calcula aₙ diretamente a partir de n. Uma lei de recorrência calcula o termo usando termos anteriores e precisa indicar os valores iniciais. A ordem dos termos importa.','aₙ = f(n), com n = 1,2,3,…','O índice n indica a posição, e não o valor do termo.',(r,k)=>{const a=r(2,5),b=r(1,8),n=r(3,10);return qNum(`A sequência é dada por aₙ = ${a}n + ${b}. Determine a${sb(n)}.`,a*n+b,[`Use n = ${n}.`,`a${sb(n)} = ${a} · ${n} + ${b} = ${a*n+b}.`])});
L('arithmetic-progression','Progressão aritmética: termo geral','6–14','Numa progressão aritmética, cada termo, a partir do segundo, é a soma do anterior com uma constante r, chamada razão.¶Para ir de a₁ até aₙ, efetuamos n − 1 acréscimos da razão. Assim, aₙ = a₁ + (n − 1)r. A progressão é crescente se r > 0, constante se r = 0 e decrescente se r < 0.','aₙ = a₁ + (n − 1)r','Entre o primeiro e o n-ésimo termo existem n − 1 passos.',(r,k)=>{const a=r(-8,12),d=r(1,6)*r.sign(),n=r(5,18);return qNum(`Uma PA tem a₁ = ${a} e razão ${d}. Determine o ${n}º termo.`,a+(n-1)*d,[`aₙ = a₁ + (n − 1)r.`,`a${sb(n)} = ${a} + (${n} − 1) · (${d}) = ${a+(n-1)*d}.`],{kind:'flow',items:[`a₁ = ${a}`,`somar ${d}`,`a${sb(n)} = ?`]})});
L('arithmetic-sum','Soma dos termos de uma PA','15–21','Na soma de uma PA finita, podemos emparelhar o primeiro termo com o último, o segundo com o penúltimo e assim por diante. Cada par tem soma a₁ + aₙ.¶Escrever a soma na ordem direta e na inversa produz n parcelas iguais em 2Sₙ. Portanto, Sₙ = n(a₁ + aₙ)/2. A fórmula vale também para n ímpar.','Sₙ = n(a₁ + aₙ)/2','Calcule o último termo antes de substituir na fórmula, se ele não estiver dado.',(r,k)=>{const a=r(1,12),d=r(1,6),n=r(4,15),last=a+(n-1)*d;return qNum(`Calcule a soma dos ${n} primeiros termos da PA com a₁ = ${a} e razão ${d}.`,n*(a+last)/2,[`a${sb(n)} = ${a} + (${n}-1) · ${d} = ${last}.`,`S${sb(n)} = ${n} · (${a} + ${last})/2 = ${n*(a+last)/2}.`])});
L('geometric-progression','Progressão geométrica: termos e soma','24–36','Uma progressão geométrica é uma sequência em que cada termo, a partir do segundo, é o produto do anterior por uma constante q. Por isso, aₙ = a₁qⁿ⁻¹.¶Para somar n termos, comparamos Sₙ e qSₙ; quase todos os termos se cancelam na subtração. Para q ≠ 1, obtemos Sₙ = a₁(qⁿ − 1)/(q − 1). Para q = 1, a soma é na₁.','aₙ = a₁qⁿ⁻¹\nSₙ = a₁(qⁿ − 1)/(q − 1), q ≠ 1','Não use a fórmula com denominador q − 1 quando q = 1.',(r,k)=>{const a=r(1,5),q=r(2,4),n=r(3,6),sum=k%2;return qNum(`Uma PG tem a₁ = ${a} e razão ${q}. Calcule ${sum?`a soma dos ${n} primeiros termos`:`o ${n}º termo`}.`,sum?a*(q**n-1)/(q-1):a*q**(n-1),sum?[`Sₙ = a₁(qⁿ − 1)/(q − 1).`,`S${sb(n)} = ${a} · (${q**n} − 1)/(${q} − 1) = ${a*(q**n-1)/(q-1)}.`]:[`aₙ = a₁qⁿ⁻¹.`,`a${sb(n)} = ${a} · ${q}^${n-1} = ${a*q**(n-1)}.`])});
L('infinite-series','Limite e soma de PG infinita','37–44','Se −1 < q < 1, as potências qⁿ tendem a zero. Nesse caso, as somas parciais de uma PG com razão q se aproximam de um valor finito.¶Tomando o limite na fórmula da soma finita, encontramos S = a₁/(1 − q). A restrição |q| < 1 é essencial para essa conclusão no caso não trivial.','S = a₁/(1 − q), para |q| < 1','Uma soma infinita não é obtida simplesmente colocando “infinito” no lugar de n.',(r,k)=>{const a=r(1,9),q=r(2,6);return qNum(`Determine a soma da PG infinita com primeiro termo ${a} e razão 1/${q}.`,fracText(a*q,q-1),[`Como |1/${q}| < 1, a soma converge.`,`S = ${a}/(1 − 1/${q}) = ${fracText(a*q,q-1)}.`])});
L('matrix-basics','Matrizes, operações e transposta','45–56; 69–79','Dados m e n naturais não nulos, chama-se matriz m por n toda tabela formada por números distribuídos em m linhas e n colunas. O elemento aᵢⱼ está na linha i e na coluna j.¶Somamos matrizes de mesma ordem elemento a elemento. Um escalar multiplica todos os elementos. A transposta troca linhas por colunas, de modo que (Aᵀ)ᵢⱼ = Aⱼᵢ.','A = (aᵢⱼ); A de ordem m × n\n(A + B)ᵢⱼ = aᵢⱼ + bᵢⱼ','O primeiro índice é a linha; o segundo, a coluna.',(r,k)=>{const A=Array.from({length:2},()=>Array.from({length:3},()=>r(-6,9))),i=r(0,2),j=r(0,1);return qNum(`Se A = ${mx(A)}, qual é o elemento da linha ${i+1}, coluna ${j+1} de Aᵀ?`,A[j][i],[`Na transposta, a posição (${i+1},${j+1}) corresponde à posição (${j+1},${i+1}) de A.`,`O elemento é ${A[j][i]}.`],{kind:'matrix',matrices:[A]})});
L('matrix-product','Produto de matrizes e inversa','57–79','O produto AB existe quando o número de colunas de A coincide com o número de linhas de B. Seu elemento cᵢⱼ é a soma dos produtos dos elementos correspondentes da linha i de A e da coluna j de B.¶A ordem importa: em geral AB ≠ BA. Uma matriz quadrada é inversível quando existe A⁻¹ tal que AA⁻¹ = A⁻¹A = I. Uma matriz 2 × 2 é inversível se seu determinante não é zero.','cᵢⱼ = Σₖ aᵢₖbₖⱼ\nA⁻¹ = (1/(ad−bc)) · [[d,−b],[−c,a]]','Multiplicação de matrizes não é multiplicação elemento a elemento.',(r,k)=>{const A=Array.from({length:2},()=>[r(-3,6),r(-3,6)]),B=Array.from({length:2},()=>[r(-3,6),r(-3,6)]),i=r(0,1),j=r(0,1),ans=A[i][0]*B[0][j]+A[i][1]*B[1][j];return qNum(`Para A = ${mx(A)} e B = ${mx(B)}, calcule (AB)${sb(i+1)}${sb(j+1)}.`,ans,[`Use a linha ${i+1} de A e a coluna ${j+1} de B.`,`${A[i][0]} · (${B[0][j]}) + ${A[i][1]} · (${B[1][j]}) = ${ans}.`],{kind:'matrix',matrices:[A,B],row:i,col:j})});
L('determinants','Determinantes e propriedades','82–132','A cada matriz quadrada associamos um número chamado determinante. Na ordem 2, calculamos ad − bc. Na ordem 3, podemos expandir por cofatores ou usar a regra de Sarrus.¶Trocar duas linhas muda o sinal do determinante. Linhas iguais ou proporcionais produzem determinante zero. Em uma matriz triangular, o determinante é o produto dos elementos da diagonal principal.','det [[a,b],[c,d]] = ad − bc','A regra de Sarrus é específica para matrizes 3 × 3.',(r,k)=>{const A=[[r(-6,8),r(-6,8)],[r(-6,8),r(-6,8)]],v=A[0][0]*A[1][1]-A[0][1]*A[1][0];return qNum(`Calcule o determinante de ${mx(A)}.`,v,[`Multiplique os elementos da diagonal principal: ${A[0][0]} · (${A[1][1]}) = ${A[0][0]*A[1][1]}.`,`Subtraia o produto da outra diagonal: ${A[0][1]} · (${A[1][0]}) = ${A[0][1]*A[1][0]}.`,`O determinante vale ${v}.`],{kind:'matrix',matrices:[A]})});
L('linear-systems','Sistemas lineares e regra de Cramer','135–148','Um sistema linear reúne equações de primeiro grau nas mesmas incógnitas. Uma solução precisa satisfazer todas elas simultaneamente. O sistema pode ter uma solução, infinitas ou nenhuma.¶Para um sistema quadrado com determinante D ≠ 0, a regra de Cramer dá uma única solução: substituímos a coluna dos coeficientes da incógnita pela coluna dos termos independentes e dividimos o novo determinante por D.','xᵢ = Dᵢ/D, quando D ≠ 0','D = 0 não decide sozinho se o sistema é impossível ou tem infinitas soluções.',(r,k)=>{const x=r(-5,6),y=r(-5,6),a=r(2,5);return qNum(`Resolva o sistema x + y = ${x+y}; ${a}x + y = ${a*x+y}. Determine x.`,x,[`Subtraia a primeira equação da segunda: ${a-1}x = ${(a-1)*x}.`,`Logo, x = ${x}.`,`A outra incógnita é y = ${x+y} − (${x}) = ${y}.`])});
L('elimination','Escalonamento e classificação','149–190','Dois sistemas são equivalentes quando possuem o mesmo conjunto solução. Trocar equações, multiplicar uma equação por uma constante não nula e somar múltiplos de equações preservam as soluções.¶O escalonamento elimina incógnitas sucessivamente. Uma linha 0 = c, com c ≠ 0, indica impossibilidade; uma linha 0 = 0 não impõe nova condição. Variáveis livres podem produzir infinitas soluções.','Operações elementares preservam o conjunto solução.','Nunca multiplique uma equação por zero para obter uma equivalente.',(r,k)=>{const x=r(-4,5),y=r(-4,5),z=r(-3,4);return qNum(`No sistema escalonado x + 2y + z = ${x+2*y+z}; y + 3z = ${y+3*z}; 2z = ${2*z}, determine x.`,x,[`Da última equação: z = ${z}.`,`Da segunda: y = ${y+3*z} − 3 · (${z}) = ${y}.`,`Da primeira: x = ${x+2*y+z} − 2 · (${y}) − (${z}) = ${x}.`])});
courseStage('Contagem e probabilidade','Como contar possibilidades e medir a chance de eventos.');
L('counting','Princípio fundamental da contagem','1–15','A análise combinatória desenvolve métodos para contar agrupamentos sem precisar enumerá-los um a um. Se uma escolha tem m possibilidades e, para cada uma delas, outra escolha tem n possibilidades, existem mn pares de escolhas.¶Em etapas sucessivas, multiplicamos as quantidades de alternativas disponíveis. Se há restrições, a quantidade pode mudar de uma etapa para outra; é preciso examiná-las antes de multiplicar.','Total de escolhas sucessivas: n₁ · n₂ · … · nₖ','Somamos casos alternativos disjuntos; multiplicamos etapas sucessivas.',(r,k)=>{const a=r(2,6),b=r(2,5),c=r(2,4);return qNum(`Há ${a} camisas, ${b} calças e ${c} pares de sapatos. Quantos trajes com uma peça de cada tipo podem ser formados?`,a*b*c,[`Escolha uma camisa: ${a} opções. Depois uma calça: ${b}. Depois um par de sapatos: ${c}.`,`Total = ${a} · ${b} · ${c} = ${a*b*c}.`],{kind:'flow',items:[`${a} camisas`,`${b} calças`,`${c} pares`]})});
L('arrangements','Arranjos com e sem repetição','15–18','Um arranjo simples de n elementos tomados k a k é uma sequência de k elementos distintos escolhidos entre os n. Como a ordem importa, mudar a posição de dois elementos produz outro arranjo.¶Sem repetição, as opções diminuem a cada escolha. Com repetição permitida, cada uma das k posições continua tendo n opções.','A(n,k) = n!/(n−k)!\nCom repetição: nᵏ','Pergunte separadamente se a ordem importa e se a repetição é permitida.',(r,k)=>{const n=r(4,9),p=r(2,3),repeat=k%2;return qNum(`Uma senha tem ${p} posições e usa ${n} símbolos possíveis, ${repeat?'com repetição permitida':'sem repetir símbolos'}. Quantas senhas existem?`,repeat?n**p:ft(n)/ft(n-p),[repeat?`Cada posição tem ${n} opções.`:`As opções são ${Array.from({length:p},(_,i)=>n-i).join(', ')}.`,`Total: ${repeat?n**p:ft(n)/ft(n-p)}.`])});
L('permutations','Permutações e elementos repetidos','18–32; 44–55','Uma permutação de n elementos é um arranjo que utiliza todos eles. Para n elementos distintos, existem n! ordenações. O fatorial é o produto n(n−1)…2·1, e 0! = 1.¶Se há elementos indistinguíveis repetidos, dividimos pelos fatoriais das suas multiplicidades, porque trocá-los entre si não cria uma nova ordenação.','Pₙ = n!\nP = n!/(n₁! n₂! …)','Em anagramas, cópias da mesma letra não são tratadas como letras distintas.',(r,k)=>{const word=r.pick(['AMOR','CASA','ARARA','BANANA','LIVRO','PARALELA']),c={};[...word].forEach(x=>c[x]=(c[x]||0)+1);const den=Object.values(c).reduce((p,n)=>p*ft(n),1),answer=ft(word.length)/den;return qNum(`Quantos anagramas distintos podem ser formados com ${word}?`,answer,[`Há ${word.length} letras, portanto partimos de ${word.length}!.`,`Dividimos pelos fatoriais das multiplicidades: ${Object.entries(c).map(([x,n])=>`${x}: ${n}`).join('; ')}.`,`Resultado: ${ft(word.length)}/${den} = ${answer}.`],{kind:'chips',items:[...word]})});
L('combinations','Combinações: quando a ordem não importa','33–43','Chamamos de combinações dos n elementos, tomados k a k, aos subconjuntos constituídos de k elementos. Um conjunto não muda quando trocamos a ordem em que seus elementos são escritos.¶Cada combinação de k elementos dá origem a k! arranjos. Por isso, dividimos o número de arranjos por k! para obter o número de combinações.','C(n,k) = n!/[k!(n−k)!]','Uma comissão sem cargos é combinação; atribuir cargos diferentes pode tornar a ordem relevante.',(r,k)=>{const n=r(5,12),p=r(2,4);return qNum(`Uma comissão de ${p} pessoas, sem cargos diferentes, será escolhida entre ${n}. Quantas comissões são possíveis?`,cb(n,p),[`A ordem das pessoas não muda a comissão.`,`C(${n},${p}) = ${n}!/[${p}! · ${n-p}!] = ${cb(n,p)}.`])});
L('binomial-theorem','Binômio de Newton e Pascal','58–82','No desenvolvimento de (x+a)ⁿ, cada termo nasce da escolha de x ou a em cada um dos n fatores. Escolher a em k fatores e x nos restantes pode ser feito de C(n,k) maneiras.¶Assim, o termo correspondente é C(n,k)xⁿ⁻ᵏaᵏ. Os coeficientes binomiais formam as linhas do triângulo de Pascal e satisfazem C(n,k) = C(n−1,k−1) + C(n−1,k).','(x+a)ⁿ = Σₖ₌₀ⁿ C(n,k)xⁿ⁻ᵏaᵏ','O índice k conta a potência de a; a potência de x é n − k.',(r,k)=>{const n=r(3,7),j=r(1,n-1),a=r(1,3),ans=cb(n,j)*a**(n-j);return qNum(`Qual é o coeficiente de x^${j} no desenvolvimento de (x + ${a})^${n}?`,ans,[`Escolhemos x em ${j} dos ${n} fatores: C(${n},${j}) = ${cb(n,j)}.`,`Os outros fatores contribuem ${a}^${n-j}.`,`Coeficiente = ${cb(n,j)} · ${a**(n-j)} = ${ans}.`])});
L('probability','Espaço amostral e eventos','89–117','O espaço amostral reúne os resultados possíveis de um experimento aleatório; um evento é um subconjunto desse espaço. A probabilidade associa a cada evento um número entre 0 e 1.¶Num espaço finito equiprovável, calculamos a razão entre casos favoráveis e casos possíveis. Para o evento complementar, P(Aᶜ) = 1 − P(A). A hipótese de equiprobabilidade precisa ser justificada pelo experimento.','P(A) = n(A)/n(Ω), em casos equiprováveis','Contar casos não basta quando os resultados têm chances diferentes.',(r,k)=>{const red=r(2,9),blue=r(2,9);return qNum(`Uma urna tem ${red} bolas vermelhas e ${blue} azuis, todas igualmente prováveis. Qual é a probabilidade de retirar uma vermelha?`,fracText(red,red+blue),[`Existem ${red+blue} bolas no total e ${red} favoráveis.`,`P = ${red}/${red+blue} = ${fracText(red,red+blue)}.`],{kind:'chips',items:[`${red} vermelhas`,`${blue} azuis`]})});
L('conditional-probability','Probabilidade condicional','118–125','P(A|B) indica a probabilidade de A sabendo que B ocorreu. Quando fazemos esse cálculo, B funciona como um espaço amostral reduzido.¶Para P(B) > 0, P(A|B) = P(A ∩ B)/P(B). Em retiradas sem reposição, o primeiro resultado altera a composição disponível para o segundo, por isso as probabilidades precisam ser atualizadas.','P(A|B) = P(A ∩ B)/P(B)','Não use o espaço amostral original quando a informação já o restringiu.',(r,k)=>{const red=r(3,9),blue=r(2,9);return qNum(`Uma urna tem ${red} bolas vermelhas e ${blue} azuis. Uma vermelha foi retirada e não devolvida. Qual é a probabilidade de a próxima bola ser vermelha?`,fracText(red-1,red+blue-1),[`Restam ${red-1} vermelhas entre ${red+blue-1} bolas.`,`A probabilidade condicional é ${fracText(red-1,red+blue-1)}.`])});
L('total-probability','Probabilidade total','126–132','Se os eventos B₁,…,Bₙ formam uma partição do espaço amostral, eles não se sobrepõem e cobrem todas as possibilidades. O evento A pode ocorrer por qualquer uma dessas rotas.¶A probabilidade total soma as probabilidades de cada rota: P(A ∩ Bᵢ) = P(Bᵢ)P(A|Bᵢ). Assim, ponderamos cada probabilidade condicional pela chance da rota correspondente.','P(A) = Σᵢ P(Bᵢ)P(A|Bᵢ)','Não faça uma média simples se as rotas tiverem probabilidades diferentes.',(r,k)=>{const a=r(1,8),b=r(1,8);return qNum(`Uma das duas urnas é escolhida com probabilidade 1/2. A urna A tem ${a} vermelhas em 10 bolas; B tem ${b} vermelhas em 10. Qual é a probabilidade total de retirar uma vermelha?`,fracText(a+b,20),[`P(V) = P(A)P(V|A) + P(B)P(V|B).`,`P(V) = (1/2) · (${a}/10) + (1/2) · (${b}/10) = ${fracText(a+b,20)}.`])});
L('independent-events','Independência de eventos','133–138','Dois eventos são independentes quando a ocorrência de um não altera a probabilidade do outro. Nesse caso, P(A ∩ B) = P(A)P(B).¶Eventos mutuamente exclusivos não são sinônimo de independentes. Se não podem ocorrer juntos e ambos têm probabilidade positiva, a ocorrência de um impede o outro.','Independência: P(A ∩ B) = P(A)P(B)','Só multiplique diretamente as probabilidades quando a independência estiver estabelecida.',(r,k)=>{const a=r(2,8),b=r(2,8);return qNum(`Dois mecanismos funcionam independentemente, com probabilidades 1/${a} e 1/${b}. Qual é a probabilidade de ambos funcionarem?`,`1/${a*b}`,[`Como são independentes, multiplicamos as probabilidades.`,`(1/${a}) · (1/${b}) = 1/${a*b}.`])});
L('binomial-probability','Ensaios de Bernoulli e lei binomial','139–145','Um ensaio de Bernoulli tem dois resultados: sucesso e fracasso. Na lei binomial, realizamos n ensaios independentes, todos com a mesma probabilidade p de sucesso.¶Uma sequência específica com k sucessos tem probabilidade pᵏ(1−p)ⁿ⁻ᵏ. Existem C(n,k) posições possíveis para os sucessos; multiplicar fornece a probabilidade de exatamente k sucessos.','P(X=k) = C(n,k)pᵏ(1−p)ⁿ⁻ᵏ','“Exatamente k”, “pelo menos k” e “no máximo k” são eventos diferentes.',(r,k)=>{const n=r(3,7),success=r(1,n-1);return qNum(`Uma moeda justa é lançada ${n} vezes, independentemente. Qual é a probabilidade de obter exatamente ${success} caras?`,fracText(cb(n,success),2**n),[`Há C(${n},${success}) = ${cb(n,success)} escolhas para as posições das caras.`,`Cada sequência tem probabilidade 1/2^${n}.`,`P = ${cb(n,success)}/${2**n} = ${fracText(cb(n,success),2**n)}.`])});
courseStage('Complexos e polinômios','Amplie os números, opere com polinômios e investigue suas raízes.');
L('complex-algebra','Forma algébrica e operações','1–16','Um número complexo pode ser escrito como z = a + bi, com a e b reais e i² = −1. Sua parte real é a, e sua parte imaginária é o número real b.¶Somamos separadamente as partes reais e imaginárias. Para multiplicar, usamos a distributividade e substituímos i² por −1. O conjugado de a+bi é a−bi; seu produto com z é a²+b².','(a+bi)(c+di) = (ac−bd) + (ad+bc)i','A parte imaginária é b, não bi.',(r,k)=>{const a=r(-5,5),b=r(1,5),c=r(-5,5),d=r(1,5),imag=k%2;return qNum(`Qual é a parte ${imag?'imaginária':'real'} de (${cx(a,b)})(${cx(c,d)})?`,imag?a*d+b*c:a*c-b*d,[`A parte real é ac − bd = ${a*c-b*d}.`,`A parte imaginária é ad + bc = ${a*d+b*c}.`,`A parte pedida é ${imag?a*d+b*c:a*c-b*d}.`])});
L('complex-polar','Módulo, argumento e forma trigonométrica','17–31','Chama-se módulo ou valor absoluto de z = x + yi ao número real não negativo |z| = √(x²+y²). No plano, ele é a distância do ponto à origem.¶Para z ≠ 0, podemos escrever z = ρ(cos θ + i sen θ), em que ρ = |z| e θ é um argumento. Argumentos que diferem por 2π representam a mesma direção. O número zero não tem argumento definido.','|z| = √(x²+y²)\nz = ρ(cos θ + i sen θ)','O quadrante é necessário para determinar o argumento.',(r,k)=>{const[a,b,c]=r.pick([[3,4,5],[5,12,13],[8,15,17]]),x=a*r.sign(),y=b*r.sign();return qNum(`Calcule o módulo de z = ${cx(x,y)}.`,c,[`|z| = √((${x})² + (${y})²).`,`|z| = √${x*x+y*y} = ${c}.`],{kind:'points',points:[[x,y,'z']],complex:true})});
L('de-moivre','Potências e raízes complexas','32–49','No produto de complexos, os módulos se multiplicam e os argumentos se somam. Repetindo essa regra, a fórmula de De Moivre fornece zⁿ = ρⁿ(cos nθ + i sen nθ).¶As n raízes de um complexo não nulo têm módulo ⁿ√ρ e argumentos (θ + 2kπ)/n, para k = 0,…,n−1. Elas ficam igualmente espaçadas numa circunferência.','[ρ(cos θ+i sen θ)]ⁿ = ρⁿ(cos nθ+i sen nθ)','Ao extrair raízes, não esqueça as diferentes determinações do argumento.',(r,k)=>{const n=r(3,40),imag=k%2,real=[1,0,-1,0][n%4],im=[0,1,0,-1][n%4];return qNum(`Qual é a parte ${imag?'imaginária':'real'} de i^${n}?`,imag?im:real,[`As potências de i repetem o ciclo 1, i, −1, −i.`,`O resto de ${n} por 4 é ${n%4}.`,`A parte pedida é ${imag?im:real}.`])});
L('polynomial-basics','Polinômios, igualdade e grau','53–68','Um polinômio é uma soma finita de termos aₖxᵏ com expoentes inteiros não negativos. Seu grau, quando não é o polinômio nulo, é o maior expoente com coeficiente não nulo.¶Dois polinômios são iguais quando seus coeficientes correspondentes são iguais. Para calcular o valor numérico, substituímos x pelo valor dado em todos os termos e respeitamos a ordem das operações.','P(x) = a₀ + a₁x + … + aₙxⁿ','Um termo com coeficiente zero não determina o grau.',(r,k)=>{const a=r(1,4),b=r(-6,6),c=r(-7,7),x=r(-3,4),ans=a*x*x+b*x+c;return qNum(`Calcule P(${x}) para P(x) = ${polyText(a,b,c)}.`,ans,[`P(${x}) = ${a} · (${x})² + (${b}) · (${x}) + (${c}).`,`P(${x}) = ${ans}.`])});
L('polynomial-division','Divisão e teorema do resto','69–97','Dividir P por um polinômio D não nulo é obter quociente Q e resto R tais que P = DQ + R, com R nulo ou de grau menor que D.¶Na divisão por x − a, o resto é constante. Substituindo x = a na identidade da divisão, obtemos R = P(a). Se P(a) = 0, então x − a é fator de P.','P(x) = D(x)Q(x) + R(x)\nResto por x−a: P(a)','Se o divisor é x + a, substitua x = −a.',(r,k)=>{const a=r(-4,4),b=r(-5,5),c=r(-8,8),ans=a*a+b*a+c;return qNum(`Qual é o resto de ${polyText(1,b,c)} na divisão por x − (${a})?`,ans,[`Pelo teorema do resto, calcule P(${a}).`,`P(${a}) = (${a})² + (${b}) · (${a}) + (${c}) = ${ans}.`])});
L('girard','Raízes e relações de Girard','100–127','Uma raiz de P(x) = 0 é um valor que anula o polinômio. No conjunto dos complexos, um polinômio de grau n tem n raízes quando contamos as multiplicidades.¶As relações de Girard ligam somas e produtos das raízes aos coeficientes. Para ax²+bx+c, a soma é −b/a e o produto é c/a. Para x³+bx²+cx+d, a soma é −b e o produto é −d.','Quadrática: r₁+r₂ = −b/a; r₁r₂ = c/a','O sinal do produto depende do grau; observe a fórmula correspondente.',(r,k)=>{const u=r(-6,7),v=r(-6,7),b=-(u+v),c=u*v,product=k%2;return qNum(`Na equação ${polyText(1,b,c)} = 0, qual é ${product?'o produto':'a soma'} das raízes?`,product?c:-b,[product?'Pelas relações de Girard, r₁r₂ = c/a.':'Pelas relações de Girard, r₁+r₂ = −b/a.',`Com a = 1, o valor pedido é ${product?c:-b}.`])});
L('conjugate-roots','Raízes conjugadas e racionais','128–145','Se uma equação polinomial de coeficientes reais admite a raiz não real a+bi, também admite a raiz a−bi. Assim, raízes não reais aparecem em pares conjugados.¶Para coeficientes inteiros, uma raiz racional p/q na forma irredutível deve ter p divisor do termo independente e q divisor do coeficiente dominante. Essa regra fornece candidatos; é necessário testá-los.','Coeficientes reais: z raiz ⇒ z̄ raiz','O teorema das raízes conjugadas exige coeficientes reais.',(r,k)=>{const a=r(-6,6),b=r(1,7);return qChoice(`Um polinômio de coeficientes reais tem raiz ${cx(a,b)}. Qual outra raiz é garantida?`,cx(a,-b),[cx(-a,b),cx(a+1,b),cx(a,b+1)],[`Tome o conjugado: mantenha a parte real e troque o sinal da parte imaginária.`,`A outra raiz é ${cx(a,-b)}.`])});
L('polynomial-transform','Transformações de equações','148–170','Uma transformação relaciona as raízes de uma equação original às de outra por uma relação conhecida y = f(x). Ao substituir x em função de y, obtemos a equação transformada.¶Por exemplo, se y = x + h, cada raiz é deslocada por h. Se a equação original tem n raízes contadas com multiplicidade, a soma das novas raízes aumenta em nh.','y = x+h ⇒ soma das novas raízes = soma original + nh','Uma transformação não permite ignorar restrições introduzidas por inversos ou raízes.',(r,k)=>{const a=r(-5,6),b=r(-5,6),h=r(1,6);return qNum(`Uma equação quadrática tem raízes ${a} e ${b}. Uma transformação define y = x + ${h}. Qual é a soma das novas raízes?`,a+b+2*h,[`As novas raízes são ${a+h} e ${b+h}.`,`A soma é ${a} + ${b} + 2 · ${h} = ${a+b+2*h}.`])});
L('multiple-roots','Derivada polinomial e multiplicidade','171–190','Uma raiz a tem multiplicidade m quando (x − a)ᵐ divide o polinômio, mas (x − a)ᵐ⁺¹ não o divide. Contar raízes distintas é diferente de contá-las com multiplicidade.¶Uma raiz múltipla de P também é raiz de P′. A derivada ajuda a detectar fatores comuns e multiplicidades. Para um monômio axⁿ, a derivada é naxⁿ⁻¹.','a raiz múltipla ⇒ P(a)=0 e P′(a)=0','A soma das multiplicidades, nos complexos, é o grau do polinômio.',(r,k)=>{const a=r(-5,5),b=a+r(1,5),m=r(2,5),n=r(1,3);return qNum(`Em P(x) = (x − (${a}))^${m}(x − (${b}))^${n}, qual é a multiplicidade da raiz ${a}?`,m,[`Como ${a} e ${b} são distintos, apenas o primeiro fator se anula em x = ${a}.`,`O fator x − (${a}) aparece elevado a ${m}; essa é a multiplicidade.`])});
courseStage('Geometria analítica','Pontos, retas, circunferências e cônicas no plano cartesiano.');
L('coordinates','Coordenadas, distância e ponto médio','1–27','No plano cartesiano, a abscissa é a coordenada horizontal e a ordenada é a vertical. Um ponto é representado pelo par ordenado (x,y).¶A distância entre dois pontos vem do teorema de Pitágoras aplicado às diferenças de coordenadas. O ponto médio tem coordenadas iguais às médias das coordenadas dos extremos.','d(A,B) = √[(x₂−x₁)²+(y₂−y₁)²]\nM = ((x₁+x₂)/2, (y₁+y₂)/2)','Troque os sinais com cuidado ao subtrair coordenadas negativas.',(r,k)=>{const x=r(-6,6),y=r(-6,6),[a,b,c]=r.pick([[3,4,5],[5,12,13],[6,8,10]]);return qNum(`Calcule a distância entre A(${x},${y}) e B(${x+a},${y+b}).`,c,[`Δx = ${a} e Δy = ${b}.`,`d = √(${a}² + ${b}²) = √${c*c} = ${c}.`],{kind:'points',points:[[x,y,'A'],[x+a,y+b,'B']]})});
L('line-equation','Equação geral e reduzida da reta','28–57','A toda reta do plano corresponde uma equação ax + by + c = 0, em que a e b não são simultaneamente nulos. Um ponto pertence à reta se suas coordenadas satisfazem a equação.¶Quando b ≠ 0, podemos isolar y e escrever y = mx + n. Retas verticais têm equação x = k e não possuem coeficiente angular finito.','ax + by + c = 0\ny = mx + n, para retas não verticais','A forma y = mx+n não representa retas verticais.',(r,k)=>{const m=r(-5,5)||2,x=r(-4,5),y=r(-6,8),b=y-m*x;return qNum(`Uma reta y = ${m}x + b passa por P(${x},${y}). Determine b.`,b,[`Substitua as coordenadas: ${y} = ${m} · (${x}) + b.`,`b = ${y} − (${m*x}) = ${b}.`],{kind:'points',points:[[x,y,'P']]})});
L('line-angles','Coeficiente angular e perpendicularidade','60–89','Para uma reta não vertical, o coeficiente angular é a razão entre a variação vertical e a horizontal: m = Δy/Δx. Ele também é a tangente do ângulo de inclinação da reta.¶Retas não verticais paralelas têm o mesmo coeficiente angular. Duas retas não verticais perpendiculares satisfazem m₁m₂ = −1. Os casos horizontal e vertical devem ser tratados separadamente.','m = (y₂−y₁)/(x₂−x₁)\nPerpendiculares: m₁m₂ = −1','Uma reta horizontal é perpendicular a uma vertical, que não possui m finito.',(r,k)=>{const m=r(1,8)*r.sign();return qNum(`Uma reta tem coeficiente angular ${m}. Qual é o coeficiente de uma reta perpendicular a ela?`,fracText(-1,m),[`Para retas não verticais perpendiculares, m₁m₂ = −1.`,`m₂ = −1/(${m}) = ${fracText(-1,m)}.`], {kind:'diagram',shape:'slope',m})});
L('point-line-distance','Distância de ponto a reta e áreas','90–115','A distância de um ponto a uma reta é a medida do segmento perpendicular entre eles. Para a reta ax+by+c=0, calculamos o valor absoluto da expressão no ponto e dividimos por √(a²+b²).¶A área de um triângulo pode ser obtida por base vezes altura sobre 2, usando uma distância de ponto a reta como altura, ou pelo valor absoluto de um determinante.','d(P,r) = |ax₀+by₀+c|/√(a²+b²)','Sem o valor absoluto, o resultado pode ser negativo, o que não representa distância.',(r,k)=>{const x=r(-4,6),y=r(-4,6),c=5*r(-5,5);return qNum(`Calcule a distância de P(${x},${y}) à reta 3x + 4y + (${c}) = 0.`,fracText(Math.abs(3*x+4*y+c),5),[`d = |3 · (${x}) + 4 · (${y}) + (${c})|/√(3²+4²).`,`d = ${Math.abs(3*x+4*y+c)}/5 = ${fracText(Math.abs(3*x+4*y+c),5)}.`], {kind:'diagram',shape:'pointline',x,y,c})});
L('circle-equation','Equação da circunferência','118–145','Dados um centro C e uma distância r > 0, a circunferência é o conjunto dos pontos do plano que estão à distância r de C.¶Com centro (a,b), sua equação reduzida é (x−a)²+(y−b)²=r². Na equação expandida, completamos quadrados para encontrar o centro e o raio. Uma soma de quadrados igual a número negativo não define circunferência real.','(x−a)² + (y−b)² = r²','Os sinais dentro dos parênteses são opostos às coordenadas do centro.',(r,k)=>{const a=r(-5,5),b=r(-5,5),rad=r(2,9);return qNum(`Qual é o raio da circunferência (x − (${a}))² + (y − (${b}))² = ${rad*rad}?`,rad,[`Compare com a forma reduzida: r² = ${rad*rad}.`,`O raio é positivo: r = ${rad}.`],{kind:'circle',r:rad,center:[a,b]})});
L('circle-tangency','Tangência e posições relativas','146–165','Compare a distância d do centro de uma circunferência a uma reta com seu raio r. Se d < r, a reta é secante; se d = r, é tangente; se d > r, é exterior.¶Para duas circunferências, a distância entre os centros deve ser comparada com a soma e a diferença dos raios. Tangência externa ocorre quando d = r₁+r₂; tangência interna, quando d = |r₁−r₂|.','Reta tangente ⇔ distância ao centro = raio','Tangência externa usa a soma dos raios; tangência interna usa a diferença em módulo.',(r,k)=>{const a=r(2,8),b=r(1,7);return qNum(`Duas circunferências de raios ${a} e ${b} são tangentes externamente. Qual é a distância entre os centros?`,a+b,[`Na tangência externa, o ponto de contato fica entre os centros.`,`d = r₁ + r₂ = ${a} + ${b} = ${a+b}.`], {kind:'diagram',shape:'tangent-circles',a,b})});
L('ellipse','Elipse','168–173','Elipse é o conjunto dos pontos de um plano cuja soma das distâncias a dois focos é uma constante 2a, maior que a distância 2c entre os focos.¶Com centro na origem e eixo maior horizontal, a equação é x²/a²+y²/b²=1, com a>b>0. Os parâmetros satisfazem c²=a²−b², e a excentricidade é e=c/a, entre 0 e 1.','Elipse: c² = a² − b²\nDistância focal = 2c','Os denominadores da equação são quadrados dos semieixos.',(r,k)=>{const scale=r(1,4),[b,c,a]=r.pick([[3,4,5],[5,12,13],[8,15,17]]).map(v=>v*scale);return qNum(`Na elipse x²/${a*a} + y²/${b*b} = 1, qual é a distância entre os focos?`,2*c,[`a² = ${a*a}, b² = ${b*b}.`,`c² = a² − b² = ${c*c}, logo c = ${c}.`,`A distância focal é 2c = ${2*c}.`], {kind:'diagram',shape:'ellipse',a,b})});
L('hyperbola','Hipérbole','174–178','Hipérbole é o conjunto dos pontos cuja diferença, em valor absoluto, das distâncias a dois focos é uma constante 2a menor que a distância focal 2c.¶Na forma x²/a²−y²/b²=1, os focos estão no eixo horizontal e c²=a²+b². A presença da subtração distingue essa equação da elipse. As assíntotas são y=±(b/a)x.','Hipérbole: c² = a² + b²','Na hipérbole, c é maior que a; na elipse, é menor.',(r,k)=>{const scale=r(1,4),[a,b,c]=r.pick([[3,4,5],[5,12,13],[8,15,17]]).map(v=>v*scale);return qNum(`Na hipérbole x²/${a*a} − y²/${b*b} = 1, determine a distância focal.`,2*c,[`c² = a² + b² = ${a*a} + ${b*b} = ${c*c}.`,`c = ${c}; a distância entre focos é 2c = ${2*c}.`], {kind:'diagram',shape:'hyperbola',a,b})});
L('parabola-locus','Parábola e lugares geométricos','178–211','Parábola é o conjunto dos pontos equidistantes de um foco F e de uma reta diretriz d, com F fora de d. Um lugar geométrico é caracterizado por uma propriedade que vale para todos os seus pontos e apenas para eles.¶Usando p para a distância entre o foco e a diretriz, uma parábola com vértice na origem e abertura para a direita tem equação y²=2px. O foco fica em (p/2,0), e a diretriz é x=−p/2.','Convenção desta aula: p = distância foco–diretriz\ny² = 2px; foco (p/2,0)','Há livros que usam outra convenção para p. Use a definição indicada na aula.',(r,k)=>{const p=2*r(1,8);return qNum(`Na parábola y² = ${2*p}x, qual é a abscissa do foco?`,p/2,[`Comparando com y² = 2px, temos p = ${p}.`,`A abscissa do foco é p/2 = ${p/2}.`], {kind:'diagram',shape:'parabola',p})});
courseStage('Limites, derivadas e integrais','Aproximação, variação instantânea e acumulação.');
L('calculus-functions','Revisão de funções para o cálculo','1–19','No cálculo, continuamos trabalhando com funções e seus domínios. Somar, multiplicar, dividir ou compor funções exige verificar onde as operações são definidas.¶O domínio de uma soma ou produto é a interseção dos domínios; num quociente, excluímos também os zeros do denominador. Na composição g∘f, a saída de f precisa pertencer ao domínio de g.','Domínio de f/g: x no domínio comum e g(x) ≠ 0','Simplificar uma expressão não recupera automaticamente pontos excluídos do domínio original.',(r,k)=>{const a=r(-7,7);return qChoice(`Qual valor deve ser excluído do domínio de f(x) = 1/(x − (${a}))?`,a,[a+1,a-1,a+2],[`O denominador não pode ser zero.`,`x − (${a}) = 0 quando x = ${a}; esse valor é excluído.`])});
L('limits','Limite e limites laterais','20–51','O limite descreve o valor para o qual f(x) se aproxima quando x se aproxima de um ponto. O valor da função exatamente nesse ponto pode não existir ou pode ser diferente do limite.¶Para que exista um limite real bilateral, os limites pela esquerda e pela direita precisam existir e coincidir. Uma indeterminação 0/0 pede uma transformação da expressão, e não significa que o limite seja zero.','limₓ→ₐ f(x) = L se os dois limites laterais coincidem em L','Nunca interprete 0/0 como um número.',(r,k)=>{const a=r(1,9);return qNum(`Calcule lim quando x → ${a} de (x² − ${a*a})/(x − ${a}).`,2*a,[`Fatore: x² − ${a*a} = (x − ${a})(x + ${a}).`,`Para x ≠ ${a}, a expressão é x + ${a}.`,`O limite é ${a} + ${a} = ${2*a}.`],{kind:'limit',a})});
L('infinite-limits','Limites infinitos e no infinito','54–86','Num limite infinito, os valores de f(x) crescem em módulo sem se aproximar de um número real finito. Num limite no infinito, quem cresce sem limite é a variável x. São situações diferentes.¶Em quocientes de polinômios de mesmo grau, dividir todos os termos pela maior potência de x mostra que o limite no infinito é a razão entre os coeficientes dominantes.','Mesmo grau: limₓ→∞ P(x)/Q(x) = coeficiente dominante de P / de Q','∞ não é um número real que possa ser manipulado como um valor comum.',(r,k)=>{const a=r(1,9),b=r(1,8),c=r(1,9);return qNum(`Calcule lim quando x → +∞ de (${a}x² + ${c})/(${b}x² + 1).`,fracText(a,b),[`Divida numerador e denominador por x².`,`Os termos ${c}/x² e 1/x² tendem a zero.`,`O limite é ${a}/${b} = ${fracText(a,b)}.`])});
L('special-limits','Limites fundamentais','87–112','A relação limₓ→₀ sen x/x = 1 é um limite fundamental da trigonometria, quando x é medido em radianos. A mudança de variável permite tratar sen(ax)/x.¶Também existe o limite exponencial que define e: (1+1/n)ⁿ tende a e quando n cresce. Essas relações ampliam o estudo dos limites para além de funções polinomiais.','limₓ→₀ sen(ax)/x = a, com x em radianos','Em graus, a fórmula do limite trigonométrico precisa de um fator de conversão.',(r,k)=>{const a=r(2,9),b=r(1,6);return qNum(`Calcule lim quando x → 0 de sen(${a}x)/(${b}x), com x em radianos.`,fracText(a,b),[`Escreva a expressão como (${a}/${b}) · sen(${a}x)/(${a}x).`,`O segundo fator tende a 1.`,`Resultado: ${fracText(a,b)}.`])});
L('continuity','Continuidade','115–126','Dizemos que f é contínua em a quando limₓ→ₐ f(x) = f(a). Isso exige que f(a) exista, que o limite exista e que os dois valores sejam iguais.¶Uma descontinuidade removível pode ser corrigida definindo o valor da função no ponto como seu limite. Alterar somente esse valor não corrige uma descontinuidade com limites laterais diferentes.','Continuidade em a: limₓ→ₐ f(x) = f(a)','A existência de f(a), sozinha, não garante continuidade.',(r,k)=>{const a=r(1,8);return qNum(`Para x ≠ ${a}, f(x) = (x² − ${a*a})/(x − ${a}). Qual deve ser f(${a}) para que f seja contínua nesse ponto?`,2*a,[`Para x ≠ ${a}, simplifique para x + ${a}.`,`O limite no ponto é ${2*a}.`,`Defina f(${a}) = ${2*a}.`])});
L('derivative','Derivada em um ponto','127–141','Chama-se derivada de f no ponto x₀ o limite [f(x)−f(x₀)]/(x−x₀) quando x tende a x₀, se esse limite existir e for finito.¶O quociente é uma taxa média de variação; a derivada é a taxa instantânea. Geometricamente, ela fornece a inclinação da reta tangente. Para xⁿ, a regra de potência dá nxⁿ⁻¹.','f′(x₀) = limₕ→₀ [f(x₀+h)−f(x₀)]/h\n(xⁿ)′ = nxⁿ⁻¹','A derivada de uma constante é zero.',(r,k)=>{const a=r(1,5),b=r(-6,6),c=r(-6,6),x=r(-4,5);return qNum(`Para f(x) = ${polyText(a,b,c)}, calcule f′(${x}).`,2*a*x+b,[`Derivando termo a termo, f′(x) = ${2*a}x + (${b}).`,`f′(${x}) = ${2*a} · (${x}) + (${b}) = ${2*a*x+b}.`],{kind:'polynomial',coeff:[c,b,a],domain:[x-3,x+3],target:x})});
L('derivative-rules','Produto, quociente e regra da cadeia','144–162','A derivada da soma é a soma das derivadas. Para um produto, derivamos um fator por vez e somamos; para um quociente, usamos a diferença no numerador e o quadrado do denominador.¶Na composição f(g(x)), a regra da cadeia multiplica a derivada da função externa, avaliada em g(x), pela derivada de g(x). Esquecer esse último fator é um erro comum.','(uv)′ = u′v + uv′\n(u/v)′ = (u′v−uv′)/v²\n(f∘g)′ = (f′∘g)g′','A derivada do produto não é, em geral, o produto das derivadas.',(r,k)=>{const a=r(2,5),b=r(1,6),x=r(0,4);return qNum(`Se f(x) = (${a}x + ${b})³, calcule f′(${x}).`,3*a*(a*x+b)**2,[`Pela regra da cadeia: f′(x) = 3(${a}x+${b})² · ${a}.`,`No ponto ${x}, a expressão interna vale ${a*x+b}.`,`f′(${x}) = ${3*a} · ${a*x+b}² = ${3*a*(a*x+b)**2}.`])});
L('function-variation','Crescimento, extremos e concavidade','163–204','O sinal da derivada informa a variação: f′ > 0 indica crescimento e f′ < 0, decrescimento em um intervalo. Pontos em que a derivada é zero são candidatos a extremos, mas precisam ser analisados.¶Uma mudança de f′ de negativa para positiva caracteriza um mínimo local; de positiva para negativa, um máximo. A segunda derivada ajuda a estudar a concavidade e os pontos de inflexão.','f′: − para + → mínimo\nf′: + para − → máximo','f′(a) = 0 não garante, por si só, um máximo ou mínimo.',(r,k)=>{const a=r(1,5),v=r(-6,6),c=r(-5,5),b=-2*a*v;return qNum(`Em que valor de x a função f(x) = ${polyText(a,b,c)} atinge seu mínimo?`,v,[`f′(x) = ${2*a}x + (${b}).`,`Resolva f′(x) = 0: x = ${v}.`,`Como f″(x) = ${2*a} > 0, trata-se de um mínimo.`],{kind:'polynomial',coeff:[c,b,a],domain:[v-4,v+4]})});
L('definite-integral','Integral definida e primitivas','208–227','A integral definida expressa uma acumulação com sinal. Para uma função não negativa, pode representar a área sob o gráfico; onde a função é negativa, a contribuição para a integral é negativa.¶Uma primitiva F satisfaz F′ = f. Pelo teorema fundamental do cálculo, para f contínua em [a,b], a integral é F(b)−F(a). Uma constante adicionada à primitiva se cancela nessa diferença.','∫ₐᵇ f(x) dx = F(b) − F(a)\n∫ xⁿ dx = xⁿ⁺¹/(n+1) + C, n ≠ −1','Área geométrica e integral com sinal podem ter valores diferentes.',(r,k)=>{const a=2*r(1,5),b=r(1,6),lo=r(0,3),hi=lo+r(2,5),F=x=>a*x*x/2+b*x;return qNum(`Calcule a integral de ${lo} até ${hi} de (${a}x + ${b}) dx.`,F(hi)-F(lo),[`Uma primitiva é F(x) = ${a/2}x² + ${b}x.`,`F(${hi}) = ${F(hi)} e F(${lo}) = ${F(lo)}.`,`A integral vale ${F(hi)} − ${F(lo)} = ${F(hi)-F(lo)}.`],{kind:'polynomial',coeff:[0,b,a/2],integrand:[b,a],domain:[lo-1,hi+1],shade:[lo,hi]})});
L('integration-applications','Técnicas e volumes por integração','228–235','Uma substituição pode transformar uma integral composta em outra mais simples; ela precisa transformar também o diferencial e, numa integral definida, os limites.¶Ao girar em torno do eixo x uma região entre y=f(x)≥0 e o eixo, somamos volumes de discos. Cada seção tem área π[f(x)]², levando à fórmula V = π∫ₐᵇ[f(x)]²dx.','V = π∫ₐᵇ [f(x)]² dx','No método dos discos, eleve o raio ao quadrado antes de integrar.',(r,k)=>{const n=r(2,6),c=r(1,4),num=c*c*n**3;return qNum(`A região entre y = ${c}x, o eixo x, x = 0 e x = ${n} gira em torno do eixo x. O volume é vπ. Determine v.`,fracText(num,3),[`V = π∫₀^${n} (${c}x)² dx.`,`Uma primitiva do integrando é ${c*c}x³/3.`,`v = ${c*c} · ${n}³/3 = ${fracText(num,3)}.`])});
courseStage('Geometria plana','Propriedades, semelhança, comprimentos e áreas de figuras planas.');
L('geometry-foundations','Ponto, reta, plano e segmentos','1–17','As noções primitivas são adotadas sem definição. Na geometria, adotamos ponto, reta e plano e estabelecemos postulados que relacionam esses entes. Dois pontos distintos determinam uma única reta.¶Um segmento reúne dois pontos e os pontos da reta situados entre eles. Se B está entre A e C, as medidas satisfazem AC = AB + BC. O ponto médio divide um segmento em dois segmentos congruentes.','B entre A e C ⇒ AC = AB + BC','A ordem dos pontos é relevante para decidir se devemos somar ou subtrair medidas.',(r,k)=>{const a=r(2,18),b=r(2,18);return qNum(`Os pontos A, B e C são colineares, com B entre A e C. AB = ${a} e BC = ${b}. Determine AC.`,a+b,[`Como B está entre os extremos, AC = AB + BC.`,`AC = ${a} + ${b} = ${a+b}.`],{kind:'flow',items:[`A — ${a} — B`,`B — ${b} — C`]})});
L('plane-angles','Ângulos e suas relações','18–34','Medimos ângulos em graus ou outras unidades. Um ângulo reto mede 90°; um ângulo raso, 180°. Ângulos complementares somam 90° e suplementares somam 180°.¶Uma bissetriz divide um ângulo em dois ângulos congruentes. Quando duas retas se cruzam, os ângulos opostos pelo vértice são congruentes, enquanto os adjacentes que formam um ângulo raso são suplementares.','Complementares: α+β=90°\nSuplementares: α+β=180°','Complementar e suplementar correspondem a somas diferentes.',(r,k)=>{const a=r(10,80),supp=k%2,total=supp?180:90;return qNum(`Qual é a medida do ângulo ${supp?'suplementar':'complementar'} de ${a}°?`,total-a,[`A soma deve ser ${total}°.`,`O ângulo procurado mede ${total}° − ${a}° = ${total-a}°.`],{kind:'angle',degrees:a})});
